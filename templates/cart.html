<link rel="stylesheet" href="/static/style.css">

<h2>Shopping Cart</h2>

<div class="quotation-info">
  <input id="customerName" placeholder="Customer Name">
  <input id="customerCompany" placeholder="Customer Company">
  <input id="customerEmail" placeholder="Customer Email">
</div>

<div id="cart"></div>

<h2 id="total"></h2>

<div class="cart-buttons">
  <button onclick="downloadPDF()">Download PDF Quotation</button>
  <button onclick="checkout()">Create Order</button>
  <button onclick="clearCart()">Clear Cart</button>
  <button onclick="goBack()">Continue Shopping</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartContainer = document.getElementById("cart");
const totalElement = document.getElementById("total");

function getTierPrice(quantity, item) {
  let unitPrice = item.price;

  if (quantity >= 50000 && item.price_50000) {
    unitPrice = item.price_50000;
  }
  else if (quantity >= 10000 && item.price_10000) {
    unitPrice = item.price_10000;
  }
  else if (quantity >= 3000 && item.price_3000) {
    unitPrice = item.price_3000;
  }
  else if (quantity >= 1000 && item.price_1000) {
    unitPrice = item.price_1000;
  }
  else if (quantity >= 500 && item.price_500) {
    unitPrice = item.price_500;
  }

  return Number(unitPrice);
}

function getTierLabel(quantity) {
  if (quantity >= 50000) return "50000+";
  if (quantity >= 10000) return "10000+";
  if (quantity >= 3000) return "3000+";
  if (quantity >= 1000) return "1000+";
  if (quantity >= 500) return "500+";
  return "Base";
}

function money(value) {
  return Number(value).toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function renderCart() {
  cartContainer.innerHTML = "";

  let grandTotal = 0;

  cart.forEach((item, index) => {
    const unitPrice = getTierPrice(item.quantity, item);
    const lineTotal = unitPrice * item.quantity;

    item.price = unitPrice;

    grandTotal += lineTotal;

    const div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <img src="${item.image}" class="cart-image">

      <div class="cart-info">
        <h3>${item.name}</h3>

        <p>Category: ${item.category || ""}</p>
        <p>MOQ: ${item.moq || ""}</p>
        <p>Material: ${item.material || ""}</p>
        <p>Size: ${item.size || ""}</p>

        <p><b>Price Tier:</b> ${getTierLabel(item.quantity)}</p>
        <p><b>Unit Price:</b> $${money(unitPrice)}</p>

        <p>
          <b>Quantity:</b>
          <input
            type="number"
            min="${item.moq}"
            value="${item.quantity}"
            onchange="updateQuantity(${index}, this.value)"
            style="width:100px;"
          >
        </p>

        <p><b>Line Total:</b> $${money(lineTotal)}</p>

        <button onclick="removeItem(${index})">Remove</button>
      </div>
    `;

    cartContainer.appendChild(div);
  });

  localStorage.setItem("cart", JSON.stringify(cart));

  totalElement.innerText = "Grand Total: $" + money(grandTotal);
}

function updateQuantity(index, value) {
  const quantity = parseInt(value);

  if(quantity < item.moq){
    alert(`Minimum Order Quantity is ${item.moq}`);
    renderCart();
    return;
  }

  const item = cart[index];
  const newPrice = getTierPrice(quantity, item);

  cart[index].quantity = quantity;
  cart[index].price = newPrice;

  localStorage.setItem("cart", JSON.stringify(cart));

  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function clearCart() {
  localStorage.removeItem("cart");
  cart = [];
  renderCart();
}

function goBack() {
  window.location.href = "products.html";
}

async function checkout() {
  const username = localStorage.getItem("user");

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const response = await fetch("/create-order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: username,
      items: cart,
      total: total
    })
  });

  const result = await response.json();

  alert(result.message);
}

async function downloadPDF() {
  const response = await fetch("/cart/pdf", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      customerName: document.getElementById("customerName").value,
      customerCompany: document.getElementById("customerCompany").value,
      customerEmail: document.getElementById("customerEmail").value,
      items: cart
    })
  });

  const blob = await response.blob();
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "quotation.pdf";
  a.click();
}

renderCart();
</script>
