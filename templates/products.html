<link rel="stylesheet" href="/static/style.css">

<h2>Products List</h2>
<input id="searchInput" placeholder="Search Products name..." oninput="searchProducts()">

<div class="top-bar">
  <div></div>

  <div class="user-box">
    <span id="currentUser"></span>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<button onclick="goCart()">View Cart</button>

<div id="list"></div>

<script>
let allProducts = [];

const user = localStorage.getItem("user");
document.getElementById("currentUser").innerText = "Logged in as: " + user;

if (!user) {
  window.location.href = "login.html";
}

const container = document.getElementById("list");

fetch("/products")
  .then(response => response.json())
  .then(products => {
    allProducts = products;
    renderProducts(allProducts);
  });

function view(id) {
  window.location.href = "product.html?id=" + id;
}

function goCart() {
  window.location.href = "cart.html";
}

function logout() {

  localStorage.removeItem("user");

  alert("You have been logged out.");

  window.location.href = "login.html";
}

function renderProducts(products) {
  container.innerHTML = "";

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product-card";
    div.innerHTML = `
      <img src="${p.image}" class="product-image">
      <h3>${p.name}</h3>
      <p>Price: $${p.price}</p>
      <button onclick="view(${p.id})">View Details</button>
    `;

    container.appendChild(div);
  });
}

function searchProducts() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(keyword)
  );

  renderProducts(filtered);
}

</script>
