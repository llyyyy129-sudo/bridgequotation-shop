<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">

  <style>
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #667085;
      cursor: pointer;
      padding: 0;
      margin: 0;
      box-shadow: none;
      font-size: 18px;
      line-height: 34px;
      border-radius: 50%;
    }

    .eye-btn:hover {
      background: #f1f5f9;
      transform: translateY(-50%);
      box-shadow: none;
    }

    .password-message {
      font-size: 13px;
      margin-top: 7px;
      min-height: 18px;
      line-height: 18px;
    }

    .password-message.error {
      color: #e11d48;
      font-weight: 700;
    }

    .password-message.ok {
      color: #16a34a;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="auth-shell">

    <section class="brand-side">
      <img class="brand-image" src="/static/image/auth_background.jpg" alt="Ningbo Future Houseware Bridge">

      <h1 class="brand-title">
        Bridge Quotation<br>
        System
      </h1>

      <p class="brand-desc">
        Submit your account request. The administrator will review and approve your access.
      </p>
    </section>


    <section class="auth-card">
      <h2 class="auth-title">Create Account</h2>

      <p class="auth-subtitle">
        Choose customer or employee account type.
      </p>

      <div class="field">
        <label>Account Type</label>
        <select id="account_type">
          <option value="customer">Customer Account</option>
          <option value="employee">Employee Account</option>
        </select>
      </div>

      <div class="field">
        <label>Username</label>
        <input id="username" placeholder="Enter username">
      </div>

      <div class="field">
        <label>Password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="At least 8 characters"
            oninput="checkPasswordMatch()"
          >
          <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('password', this)"
            aria-label="Show password"
          >👁</button>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>

        <div class="password-wrap">
          <input
            id="confirm_password"
            type="password"
            placeholder="Enter password again"
            oninput="checkPasswordMatch()"
          >
          <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('confirm_password', this)"
            aria-label="Show confirm password"
          >👁</button>
        </div>

        <div id="passwordMessage" class="password-message"></div>
      </div>

      <div class="field">
        <label>Company Name</label>
        <input id="company_name" placeholder="Enter company name">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter email">
      </div>

      <button class="btn btn-primary" onclick="register()">Submit Registration</button>
      <button class="btn btn-outline" onclick="goLogin()">Go to Login</button>
      <button class="btn btn-outline" onclick="goChangePassword()">Change Password</button>
    </section>

  </main>


  <script>
    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.innerText = "🙈";
      } else {
        input.type = "password";
        button.innerText = "👁";
      }
    }


    function checkPasswordMatch() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const message = document.getElementById("passwordMessage");

      message.className = "password-message";
      message.innerText = "";

      if (!confirmPassword) {
        return false;
      }

      if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        message.classList.add("error");
        return false;
      }

      if (password.length < 8) {
        message.innerText = "Password must be at least 8 characters.";
        message.classList.add("error");
        return false;
      }

      message.innerText = "Passwords match.";
      message.classList.add("ok");
      return true;
    }


    function register() {
      const accountType = document.getElementById("account_type").value;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value.trim();
      const companyName = document.getElementById("company_name").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!username || !password || !confirmPassword || !companyName || !email) {
        alert("Please fill in all fields.");
        return;
      }

      if (password.length < 8) {
        document.getElementById("passwordMessage").innerText =
          "Password must be at least 8 characters.";
        document.getElementById("passwordMessage").className =
          "password-message error";
        return;
      }

      if (password !== confirmPassword) {
        document.getElementById("passwordMessage").innerText =
          "Passwords do not match.";
        document.getElementById("passwordMessage").className =
          "password-message error";
        return;
      }

      fetch("/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          account_type: accountType,
          username: username,
          password: password,
          company_name: companyName,
          email: email
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          window.location.href = "login.html";
        }
      })
      .catch(error => {
        console.error("Register error:", error);
        alert("Registration failed. Please check server logs.");
      });
    }

    function goLogin() {
      window.location.href = "login.html";
    }

    function goChangePassword() {
      window.location.href = "change_password.html";
    }
  </script>

</body>
</html>
