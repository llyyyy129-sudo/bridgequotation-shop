<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin User Approval</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 35px;
            color: #222;
        }

        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            background: white;
            border-radius: 14px;
            padding: 22px 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .top-bar h1 {
            margin: 0;
            color: #1f3c88;
            font-size: 30px;
        }

        .admin-info {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 26px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
            color: #1f3c88;
        }

        .user-card {
            border: 1px solid #e2e5ec;
            border-radius: 12px;
            padding: 18px 20px;
            background: #fafbff;
            margin-bottom: 16px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .user-card.processing {
            opacity: 0.55;
            transform: scale(0.99);
        }

        .user-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .user-info {
            line-height: 1.8;
            font-size: 15px;
        }

        .button-row {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }

        .approve-btn {
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .reject-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .empty-message {
            color: #777;
            background: #f8f9fc;
            border-radius: 10px;
            padding: 16px;
        }

        .status-approved {
            color: #4caf50;
            font-weight: bold;
        }

        .status-pending {
            color: #ff9800;
            font-weight: bold;
        }

        .status-rejected {
            color: #f44336;
            font-weight: bold;
        }

        details {
            margin-bottom: 18px;
        }

        summary {
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #1f3c88;
        }

        .toast {
            position: fixed;
            left: 50%;
            top: 32px;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.84);
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 15px;
            display: none;
            z-index: 9999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.22);
        }
    </style>
</head>

<body>

<div class="admin-page">

    <div class="top-bar">
        <div>
            <h1>Admin Dashboard</h1>
            <div class="admin-info">
                Current Admin: <b id="adminName"></b>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>


    <div class="section">
        <h2 id="pendingTitle">Pending User Approval (0)</h2>

        <div id="pendingUsers"></div>
    </div>


    <div class="section">
        <details id="allUsersDetails" open>
            <summary id="allUsersTitle">All Users (0)</summary>
            <br>
            <div id="allUsers"></div>
        </details>
    </div>

</div>

<div id="toast" class="toast"></div>


<script>
const currentUser = localStorage.getItem("user");
const currentRole = localStorage.getItem("role");

document.getElementById("adminName").innerText = currentUser || "Unknown";

if (!currentUser) {
    alert("Please login first.");
    window.location.href = "login.html";
}

if (currentRole !== "admin") {
    alert("Only admin can access this page.");
    window.location.href = "login.html";
}


async function loadAdminUsers() {
    await loadPendingUsers();
    await loadAllUsers();
}


async function loadPendingUsers() {
    const response = await fetch("/admin/users/pending");
    const users = await response.json();

    document.getElementById("pendingTitle").innerText =
        "Pending User Approval (" + users.length + ")";

    const container = document.getElementById("pendingUsers");
    container.innerHTML = "";

    if (users.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No pending users.
            </div>
        `;
        return;
    }

    users.forEach(user => {
        container.innerHTML += `
            <div class="user-card" id="pending-user-${user.id}">
                <div class="user-title">
                    User #${user.id} - ${user.username}
                </div>

                <div class="user-info">
                    Account Type: <b>${formatAccountType(user.account_type)}</b><br>
                    Company: <b>${user.company_name || ""}</b><br>
                    Email: <b>${user.email || ""}</b><br>
                    Role After Approval: <b>${user.role || ""}</b><br>
                    Status: <span class="status-pending">${user.approval_status}</span>
                </div>

                <div class="button-row">
                    <button class="approve-btn" onclick="approveUser(${user.id})">
                        Approve
                    </button>

                    <button class="reject-btn" onclick="rejectUser(${user.id})">
                        Reject
                    </button>
                </div>
            </div>
        `;
    });
}


async function loadAllUsers() {
    const response = await fetch("/admin/users");
    const users = await response.json();

    document.getElementById("allUsersTitle").innerText =
        "All Users (" + users.length + ")";

    const container = document.getElementById("allUsers");
    container.innerHTML = "";

    if (users.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No users.
            </div>
        `;
        return;
    }

    users.forEach(user => {
        container.innerHTML += `
            <div class="user-card">
                <div class="user-title">
                    User #${user.id} - ${user.username}
                </div>

                <div class="user-info">
                    Account Type: <b>${formatAccountType(user.account_type)}</b><br>
                    Company: <b>${user.company_name || ""}</b><br>
                    Email: <b>${user.email || ""}</b><br>
                    Role: <b>${user.role || ""}</b><br>
                    Assigned Sales: <b>${user.assigned_sales || ""}</b><br>
                    Status: ${formatStatus(user.approval_status)}
                </div>
            </div>
        `;
    });
}


function formatAccountType(type) {
    if (type === "employee") {
        return "Employee";
    }

    return "Customer";
}


function formatStatus(status) {
    if (status === "Approved") {
        return `<span class="status-approved">Approved</span>`;
    }

    if (status === "Rejected") {
        return `<span class="status-rejected">Rejected</span>`;
    }

    return `<span class="status-pending">Pending</span>`;
}


function setProcessing(userId, processing) {
    const card = document.getElementById("pending-user-" + userId);

    if (!card) return;

    if (processing) {
        card.classList.add("processing");
    } else {
        card.classList.remove("processing");
    }

    const buttons = card.querySelectorAll("button");
    buttons.forEach(button => {
        button.disabled = processing;
    });
}


async function approveUser(userId) {
    const ok = confirm("Approve this user?");

    if (!ok) return;

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/users/" + userId + "/approve",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Approve error:", error);
        alert("Approve failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


async function rejectUser(userId) {
    const ok = confirm("Reject this user?");

    if (!ok) return;

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/users/" + userId + "/reject",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Reject error:", error);
        alert("Reject failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


function showToast(message) {
    const toast = document.getElementById("toast");

    toast.innerText = message;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 1800);
}


function logout() {
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    localStorage.removeItem("assigned_sales");
    localStorage.removeItem("company_name");
    localStorage.removeItem("email");
    window.location.href = "login.html";
}


loadAdminUsers();
</script>

</body>
</html>
