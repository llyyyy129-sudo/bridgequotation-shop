<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <link rel="stylesheet" href="/static/style.css">

  <style>
    body {
      background: linear-gradient(180deg, #eef4ff 0%, #f7f9fd 42%, #eef2f7 100%);
      color: #111827;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* Override old global #detail style from style.css */
    #detail {
      background: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      max-width: none !important;
      width: 100% !important;
      margin: 0 !important;
    }

    #detail img {
      border-radius: 0;
    }

    .commerce-shell {
      width: min(1480px, calc(100% - 56px));
      margin: 24px auto 48px;
    }

    .commerce-nav {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1.3fr auto 1.3fr;
      align-items: center;
      gap: 18px;
      position: sticky;
      top: 14px;
      z-index: 999;
      backdrop-filter: blur(14px);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-logo-box {
      width: 210px;
      height: 58px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .brand-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 900;
      color: #1f3c88;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand-subtitle {
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
    }

    .nav-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .nav-pill {
      min-width: 110px;
      padding: 13px 18px;
      border-radius: 999px;
      background: #ffffff;
      color: #1f3c88;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }

    .nav-pill.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.24);
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-chip {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      color: #1f2937;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-btn,
    .logout-btn {
      border-radius: 14px;
      padding: 12px 18px;
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
    }

    .cart-btn {
      background: #2563eb;
    }

    .logout-btn {
      background: #1f3c88;
    }

    .product-detail-page {
      max-width: 1280px;
      margin: 30px auto 0;
    }

    .detail-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .breadcrumb {
      color: #64748b;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .product-detail-page h2 {
      margin: 0;
      color: #1f3c88;
      font-size: 30px;
      font-weight: 900;
    }

    .top-back-btn {
      background: #ffffff;
      border: 1px solid #dbeafe;
      color: #1f3c88;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .product-detail-card {
      display: grid;
      grid-template-columns: minmax(430px, 560px) minmax(380px, 1fr);
      gap: 28px;
      align-items: flex-start;
    }

    .media-gallery {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 30px;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.08);
      padding: 24px;
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 18px;
      align-items: flex-start;
      align-self: flex-start;
    }

    .thumb-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .thumb-item {
      width: 76px;
      height: 76px;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      padding: 0;
      margin: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .thumb-item:hover {
      border-color: #93c5fd;
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .thumb-item.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-thumb {
      background: #0f172a;
      color: white;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      flex-direction: column;
      gap: 4px;
    }

    .video-thumb .play-icon {
      font-size: 24px;
    }

    .main-media {
      width: 100%;
      min-height: 460px;
      background: linear-gradient(180deg, #f8fafc, #eef2ff);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .main-media img {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }

    .main-media video {
      width: 100%;
      max-height: 520px;
      border-radius: 18px;
      background: #000;
    }

    .product-info {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 30px;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.08);
      padding: 24px;
      align-self: flex-start;
    }

    .product-info h3 {
      font-size: 34px;
      margin: 0 0 12px 0;
      color: #111827;
      line-height: 1.15;
    }

    .category-badge {
      display: inline-flex;
      width: fit-content;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef4ff;
      border: 1px solid #bfdbfe;
      color: #1f3c88;
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .product-desc {
      color: #4b5563;
      line-height: 1.75;
      font-size: 15px;
      margin: 0 0 22px 0;
    }

    .quick-spec-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0 22px;
    }

    .quick-spec {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px 14px;
    }

    .quick-spec-label {
      color: #64748b;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .quick-spec-value {
      color: #111827;
      font-weight: 900;
      line-height: 1.35;
      word-break: break-word;
    }

    .price-table-wrap {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 16px;
      margin: 18px 0;
    }

    .section-title {
      color: #1f3c88;
      font-size: 18px;
      font-weight: 900;
      margin: 0 0 12px 0;
    }

    .price-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      overflow: hidden;
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    .price-table th,
    .price-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }

    .price-table tr:last-child td {
      border-bottom: none;
    }

    .price-table th {
      background: #eff6ff;
      color: #1f3c88;
      font-weight: 900;
    }

    .live-price-box {
      background: linear-gradient(135deg, #1f3c88, #2563eb);
      color: white;
      border-radius: 20px;
      padding: 18px 20px;
      margin: 18px 0;
      line-height: 1.8;
      box-shadow: 0 16px 34px rgba(37, 99, 235, 0.2);
    }

    .live-price-box b {
      color: #dbeafe;
    }

    .packing-row {
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: #374151;
    }

    .packing-row label {
      font-weight: 900;
    }

    .packing-value {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      color: #111827;
      font-weight: 800;
    }

    .requirements-card {
      margin-top: 18px;
      padding: 16px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }

    .requirements-box {
      width: 100%;
      max-width: 100%;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .requirements-box label {
      display: block;
      font-weight: 900;
      color: #111827;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .requirements-box .hint {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .requirements-textarea {
      width: 100%;
      max-width: 100%;
      min-height: 98px;
      resize: vertical;
      border: 1.5px solid #d7dce7;
      border-radius: 14px;
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.5;
      background: white;
      outline: none;
      display: block;
      box-sizing: border-box;
    }

    .requirements-textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .action-area {
      max-width: 1280px;
      margin: 22px auto 0;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 22px 28px;
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      bottom: 18px;
      z-index: 100;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-area label {
      font-weight: 900;
      color: #111827;
    }

    .action-area input {
      width: 170px;
      height: 46px;
      border-radius: 14px;
      border: 1.5px solid #d7dce7;
      padding: 0 12px;
      font-size: 16px;
      font-weight: 800;
      outline: none;
    }

    .action-area input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-action,
    .secondary-action {
      min-width: 150px;
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 900;
    }

    .primary-action {
      background: #2563eb;
      color: white;
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.25);
    }

    .secondary-action {
      background: #ffffff;
      color: #1f3c88;
      border: 1px solid #dbeafe;
    }

    .sales-mode-product-banner {
      max-width: 1280px;
      margin: 18px auto 0;
      background: #eef4ff;
      border: 1px solid #bfdbfe;
      border-radius: 18px;
      padding: 16px 20px;
      color: #1f3c88;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.12);
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sales-mode-product-banner b {
      color: #111827;
    }

    .sales-mode-product-banner button {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 900;
      background: #1f3c88;
      color: white;
    }

    .center-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #eef4ff;
      color: #1f3c88;
      border: 1px solid #bfdbfe;
      padding: 16px 26px;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      max-width: min(520px, 86vw);
      word-break: break-word;
      text-align: center;
      display: none;
      z-index: 99999;
    }

    .center-confirm-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.12);
      z-index: 100000;
      padding: 20px;
    }

    .center-confirm-box {
      width: min(480px, 90vw);
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 26px 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      text-align: center;
    }

    .center-confirm-message {
      color: #111827;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.65;
      white-space: pre-line;
      margin-bottom: 22px;
    }

    .center-confirm-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .center-confirm-ok,
    .center-confirm-cancel {
      min-width: 104px;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10);
    }

    .center-confirm-ok {
      background: #2563eb;
      color: #ffffff;
    }

    .center-confirm-cancel {
      background: #f3f4f6;
      color: #374151;
    }

    @media (max-width: 1120px) {
      .commerce-nav {
        grid-template-columns: 1fr;
      }

      .nav-center,
      .nav-right {
        justify-content: flex-start;
      }

      .product-detail-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .commerce-shell {
        width: min(100% - 28px, 1480px);
        margin-top: 14px;
      }

      .brand-area {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand-logo-box {
        width: 100%;
        max-width: 260px;
      }

      .nav-pill,
      .cart-btn,
      .logout-btn,
      .primary-action,
      .secondary-action {
        width: 100%;
      }

      .media-gallery {
        grid-template-columns: 1fr;
      }

      .thumb-list {
        order: 2;
        flex-direction: row;
        max-height: none;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .thumb-item {
        flex: 0 0 72px;
      }

      .main-media {
        min-height: 310px;
      }

      .quick-spec-grid {
        grid-template-columns: 1fr;
      }

      .action-area {
        position: static;
        padding: 18px;
      }

      .action-area input,
      .quantity-box,
      .action-buttons {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div id="centerToast" class="center-toast"></div>

<div id="centerConfirmOverlay" class="center-confirm-overlay">
  <div class="center-confirm-box">
    <div id="centerConfirmMessage" class="center-confirm-message"></div>

    <div class="center-confirm-actions">
      <button id="centerConfirmOk" class="center-confirm-ok" type="button">Confirm</button>
      <button id="centerConfirmCancel" class="center-confirm-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<div class="commerce-shell">
  <div class="commerce-nav">
    <div class="brand-area">
      <div class="brand-logo-box">
        <img src="/static/image/bg2.jpg" alt="Bridge Logo">
      </div>
      <div>
        <div class="brand-name">Bridge Quotation</div>
        <div class="brand-subtitle">Product selection and quotation platform</div>
      </div>
    </div>

    <div class="nav-center">
      <button class="nav-pill" onclick="goBack()">Products</button>
      <button id="ordersNavBtn" class="nav-pill" onclick="goMyOrders()">My Orders</button>
    </div>

    <div class="nav-right">
      <div class="user-chip">Logged in as: <b id="navUserName">-</b></div>
      <button class="cart-btn" onclick="goCart()">Cart <span id="cartCount">0</span></button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="salesModeProductBanner" class="sales-mode-product-banner">
    <div>
      <b>Sales Mode</b><br>
      Creating order for customer: <b id="salesModeProductCustomer"></b>
    </div>
    <button onclick="backToSalesDashboard()">Back to Sales Dashboard</button>
  </div>

  <div class="product-detail-page">
    <div class="detail-top-row">
      <div>
        <div class="breadcrumb">Products / Product Details</div>
        <h2>Product Details</h2>
      </div>
      <button class="top-back-btn" onclick="goBack()">Back to Products</button>
    </div>

    <div id="detail"></div>
  </div>

  <div class="action-area">
    <div class="quantity-box">
      <label>Quantity:</label>
      <input id="quantity" type="number" value="1" min="1" onchange="updatePrice()" oninput="updatePrice()">
    </div>

    <div class="action-buttons">
      <button class="primary-action" onclick="addToCart()">Add to Cart</button>
      <button class="secondary-action" onclick="goBack()">Back to Products</button>
    </div>
  </div>
</div>

<script>
function showCenterMessage(message) {
  const toast = document.getElementById("centerToast");

  if (!toast) {
    return;
  }

  toast.innerText = message;
  toast.style.display = "block";

  if (window.centerToastTimer) {
    clearTimeout(window.centerToastTimer);
  }

  window.centerToastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 1700);
}

function showCenterConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("centerConfirmOverlay");
    const messageBox = document.getElementById("centerConfirmMessage");
    const okButton = document.getElementById("centerConfirmOk");
    const cancelButton = document.getElementById("centerConfirmCancel");

    if (!overlay || !messageBox || !okButton || !cancelButton) {
      resolve(false);
      return;
    }

    messageBox.innerText = message;
    overlay.style.display = "flex";

    const close = (result) => {
      overlay.style.display = "none";
      okButton.onclick = null;
      cancelButton.onclick = null;
      overlay.onclick = null;
      resolve(result);
    };

    okButton.onclick = () => close(true);
    cancelButton.onclick = () => close(false);

    overlay.onclick = (event) => {
      if (event.target === overlay) {
        close(false);
      }
    };
  });
}

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const user = localStorage.getItem("user") || "";
const role = localStorage.getItem("role") || "";

if (role === "sales") {
  const ordersNavBtn = document.getElementById("ordersNavBtn");
  if (ordersNavBtn) {
    ordersNavBtn.innerText = "Sales Dashboard";
  }
}

if (role === "admin") {
  const ordersNavBtn = document.getElementById("ordersNavBtn");
  if (ordersNavBtn) {
    ordersNavBtn.innerText = "Admin Dashboard";
  }

  document.querySelectorAll(".top-back-btn, .secondary-action").forEach(button => {
    button.innerText = "Back to Admin";
  });
}

const urlParamsForSales = new URLSearchParams(window.location.search);
const urlSalesCustomer = urlParamsForSales.get("sales_customer");

if (!user) {
  window.location.href = "login.html";
}

if (urlSalesCustomer && role === "sales") {
  localStorage.setItem("sales_mode_active", "1");
  localStorage.setItem("sales_mode_customer", urlSalesCustomer);
  localStorage.setItem("sales_mode_sales", user || "");
}

const salesModeActive =
  role === "sales" &&
  localStorage.getItem("sales_mode_active") === "1" &&
  localStorage.getItem("sales_mode_customer");

const salesModeCustomer =
  salesModeActive ? localStorage.getItem("sales_mode_customer") : "";

const productPriceUsername =
  salesModeActive ? salesModeCustomer : user;

document.getElementById("navUserName").innerText = salesModeActive
  ? user + " / for " + salesModeCustomer
  : user;

setupSalesModeBanner();
updateCartCount();

function money(value) {
  return Number(value || 0).toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function displayMoney(value) {
  if (value === null || value === undefined || value === "") {
    return "-";
  }

  return "$" + money(value);
}

function setupSalesModeBanner() {
  const banner = document.getElementById("salesModeProductBanner");

  if (!banner) return;

  if (salesModeActive) {
    banner.style.display = "flex";
    document.getElementById("salesModeProductCustomer").innerText =
      salesModeCustomer;
  } else {
    banner.style.display = "none";
  }
}

function getCartKey() {
  if (salesModeActive && salesModeCustomer) {
    return "sales_cart_" + salesModeCustomer;
  }

  return "cart";
}

function updateCartCount() {
  const cartKey = getCartKey();
  const cart = JSON.parse(localStorage.getItem(cartKey)) || [];
  const totalQty = cart.reduce((sum, item) => {
    return sum + Number(item.quantity || 0);
  }, 0);

  const cartCount = document.getElementById("cartCount");
  if (cartCount) {
    cartCount.innerText = totalQty;
  }
}

fetch(`/products/${id}?username=${encodeURIComponent(productPriceUsername)}`)
  .then(response => response.json())
  .then(product => {
    document.getElementById("quantity").value = product.moq;
    document.getElementById("quantity").min = product.moq;

    window.currentProduct = product;

    renderProductDetail(product);

    updatePrice();
  });

function renderProductDetail(product) {
  const images = getGalleryImages(product);
  const hasVideo = product.video && String(product.video).trim();

  const thumbnails = [];

  images.forEach((image, index) => {
    thumbnails.push(`
      <button
        class="thumb-item ${index === 0 ? "active" : ""}"
        onclick="showImage('${escapeForJs(image)}', this)"
        type="button"
      >
        <img src="${escapeAttr(image)}">
      </button>
    `);
  });

  if (hasVideo) {
    thumbnails.push(`
      <button
        class="thumb-item video-thumb ${images.length === 0 ? "active" : ""}"
        onclick="showVideo('${escapeForJs(product.video)}', this)"
        type="button"
      >
        <span class="play-icon">▶</span>
        <span>VIDEO</span>
      </button>
    `);
  }

  const firstImage = images.length > 0 ? images[0] : product.image;

  document.getElementById("detail").innerHTML = `
    <div class="product-detail-card">
      <div class="media-gallery">
        <div class="thumb-list">
          ${thumbnails.join("")}
        </div>

        <div id="mainMedia" class="main-media">
          ${
            firstImage
              ? `<img src="${escapeAttr(firstImage)}" alt="${escapeAttr(product.name)}">`
              : `<div>No Image</div>`
          }
        </div>
      </div>

      <div class="product-info">
        <div class="category-badge">${escapeHtml(product.category || "Product")}</div>
        <h3>${escapeHtml(product.name)}</h3>

        <p class="product-desc">${escapeHtml(product.description || "")}</p>

        <div class="quick-spec-grid">
          <div class="quick-spec">
            <div class="quick-spec-label">MOQ</div>
            <div class="quick-spec-value">${Number(product.moq || 0).toLocaleString()} pcs</div>
          </div>

          <div class="quick-spec">
            <div class="quick-spec-label">Material</div>
            <div class="quick-spec-value">${escapeHtml(product.material || "-")}</div>
          </div>

          <div class="quick-spec">
            <div class="quick-spec-label">Size</div>
            <div class="quick-spec-value">${escapeHtml(product.size || "-")}</div>
          </div>

          <div class="quick-spec">
            <div class="quick-spec-label">Volume</div>
            <div class="quick-spec-value">${escapeHtml(product.volume || "-")}</div>
          </div>
        </div>

        <div class="price-table-wrap">
          <div class="section-title">Price Breaks</div>
          <table class="price-table">
            <tr>
              <th>Qty Break</th>
              <th>Unit Price</th>
            </tr>

            <tr>
              <td>500+ pcs</td>
              <td>${displayMoney(product.price_500)}</td>
            </tr>

            <tr>
              <td>1,000+ pcs</td>
              <td>${displayMoney(product.price_1000)}</td>
            </tr>

            <tr>
              <td>3,000+ pcs</td>
              <td>${displayMoney(product.price_3000)}</td>
            </tr>

            <tr>
              <td>10,000+ pcs</td>
              <td>${displayMoney(product.price_10000)}</td>
            </tr>

            <tr>
              <td>50,000+ pcs</td>
              <td>${displayMoney(product.price_50000)}</td>
            </tr>
          </table>
        </div>

        <div id="livePrice" class="live-price-box"></div>

        <div class="packing-row">
          <label>Packing:</label>
          <span class="packing-value">
            ${escapeHtml(product.packing || "Not specified")}
          </span>
        </div>

        <div class="requirements-card">
          <div class="requirements-box">
            <label>Customer Requirements</label>
            <div class="hint">
              Please write your special requests here, such as packing, size, color, label, artwork, shipping mark or other requirements.
            </div>

            <textarea
              id="customerRequirement"
              class="requirements-textarea"
              placeholder="Example: Need color box packing, black color, or custom size."
            ></textarea>
          </div>
        </div>
      </div>
    </div>
  `;
}

function getGalleryImages(product) {
  const list = [];

  const fields = [
    product.image,
    product.image_2,
    product.image_3,
    product.image_4,
    product.image_5,
    product.image_6
  ];

  fields.forEach(image => {
    if (image && String(image).trim()) {
      list.push(String(image).trim());
    }
  });

  if (product.gallery_images && Array.isArray(product.gallery_images)) {
    product.gallery_images.forEach(image => {
      if (image && !list.includes(image)) {
        list.push(image);
      }
    });
  }

  return list;
}

function showImage(src, button) {
  setActiveThumb(button);

  document.getElementById("mainMedia").innerHTML = `
    <img src="${escapeAttr(src)}" alt="Product Image">
  `;
}

function showVideo(src, button) {
  setActiveThumb(button);

  document.getElementById("mainMedia").innerHTML = `
    <video controls autoplay>
      <source src="${escapeAttr(src)}">
      Your browser does not support video playback.
    </video>
  `;
}

function setActiveThumb(button) {
  document.querySelectorAll(".thumb-item").forEach(item => {
    item.classList.remove("active");
  });

  button.classList.add("active");
}

function getTierPrice(quantity, product) {
  let unitPrice = product.price_500 || product.price;

  if (quantity >= 50000) {
    unitPrice = product.price_50000;
  }
  else if (quantity >= 10000) {
    unitPrice = product.price_10000;
  }
  else if (quantity >= 3000) {
    unitPrice = product.price_3000;
  }
  else if (quantity >= 1000) {
    unitPrice = product.price_1000;
  }
  else if (quantity >= 500) {
    unitPrice = product.price_500;
  }

  return Number(unitPrice);
}

function getTierLabel(quantity) {
  if (quantity >= 50000) return "50,000+ pcs";
  if (quantity >= 10000) return "10,000+ pcs";
  if (quantity >= 3000) return "3,000+ pcs";
  if (quantity >= 1000) return "1,000+ pcs";
  if (quantity >= 500) return "500+ pcs";
  return "MOQ";
}

function updatePrice() {
  const quantityInput = document.getElementById("quantity");

  let quantity = parseInt(quantityInput.value);

  if (isNaN(quantity)) {
    return;
  }

  if (quantity < currentProduct.moq) {
    showCenterMessage(`Minimum Order Quantity is ${currentProduct.moq} pcs`);

    quantityInput.value = currentProduct.moq;

    quantity = currentProduct.moq;
  }

  const unitPrice = getTierPrice(quantity, currentProduct);
  const total = quantity * unitPrice;

  document.getElementById("livePrice").innerHTML = `
    <b>Selected Tier:</b> ${getTierLabel(quantity)}
    <br>
    <b>Unit Price:</b> $${money(unitPrice)}
    <br>
    <b>Amount:</b> $${money(total)}
  `;
}

function addToCart() {
  if (role === "sales" && !salesModeActive) {
    showCenterMessage("Please choose a customer from Sales Dashboard before adding products.");

    setTimeout(() => {
      window.location.href = "sales.html";
    }, 900);

    return;
  }

  const cartKey = getCartKey();
  let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

  const quantityInput = document.getElementById("quantity");

  let quantity = parseInt(quantityInput.value);

  if (isNaN(quantity) || quantity < currentProduct.moq) {
    showCenterMessage(`Minimum Order Quantity is ${currentProduct.moq} pcs`);

    quantityInput.value = currentProduct.moq;

    updatePrice();

    return;
  }

  const unitPrice = getTierPrice(quantity, currentProduct);

  const requirementInput = document.getElementById("customerRequirement");
  const customerRequirement = requirementInput
    ? requirementInput.value.trim()
    : "";

  currentProduct.customer_requirement = customerRequirement;
  currentProduct.packing = currentProduct.packing || "";

  const existing = cart.find(
    item => item.id === currentProduct.id
  );

  if (existing) {
    existing.quantity += quantity;
    existing.price = getTierPrice(existing.quantity, currentProduct);
    existing.packing = currentProduct.packing || "";
    existing.customer_requirement = customerRequirement;
    existing.order_customer = salesModeActive ? salesModeCustomer : user;
    existing.created_by_sales = salesModeActive ? user : "";
  } else {
    cart.push({
      ...currentProduct,
      quantity: quantity,
      price: unitPrice,
      packing: currentProduct.packing || "",
      customer_requirement: customerRequirement,
      order_customer: salesModeActive ? salesModeCustomer : user,
      created_by_sales: salesModeActive ? user : ""
    });
  }

  localStorage.setItem(cartKey, JSON.stringify(cart));
  updateCartCount();

  showCenterMessage(`Added to cart!\nUnit Price: $${money(unitPrice)}`);
}

function goBack() {
  if (salesModeActive) {
    window.location.href =
      "products.html?sales_customer=" + encodeURIComponent(salesModeCustomer);
    return;
  }

  if (role === "admin") {
    window.location.href = "admin.html";
    return;
  }

  if (role === "sales") {
    window.location.href = "sales.html";
    return;
  }

  window.location.href = "products.html";
}

function goMyOrders() {
  if (role === "admin") {
    window.location.href = "admin.html";
    return;
  }

  if (role === "sales" || salesModeActive) {
    window.location.href = "sales.html";
    return;
  }

  window.location.href = "my_orders.html";
}

function goCart() {
  if (role === "sales" && !salesModeActive) {
    showCenterMessage("Please select a customer from Sales Dashboard first.");

    setTimeout(() => {
      window.location.href = "sales.html";
    }, 900);

    return;
  }

  window.location.href = "cart.html";
}

function backToSalesDashboard() {
  window.location.href = "sales.html";
}

async function logout() {
  const ok = await showCenterConfirm(
    "Logout?\n\nAre you sure you want to log out?"
  );

  if (!ok) return;

  localStorage.removeItem("user");
  localStorage.removeItem("role");
  localStorage.removeItem("assigned_sales");
  localStorage.removeItem("company_name");
  localStorage.removeItem("email");
  localStorage.removeItem("sales_mode_active");
  localStorage.removeItem("sales_mode_customer");
  localStorage.removeItem("sales_mode_sales");
  localStorage.removeItem("sales_mode_customer_company");
  localStorage.removeItem("sales_mode_customer_email");

  showCenterMessage("You have been logged out.");

  setTimeout(() => {
    window.location.href = "login.html";
  }, 900);
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeForJs(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

function escapeAttr(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
