<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>

  <link rel="stylesheet" href="/static/style.css">

  <style>
    input {
      width: 100%;
      box-sizing: border-box;
    }

    .note {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 15px;
    }
  </style>
</head>

<body class="auth-page">

  <div class="box">

    <h2>Change Password</h2>

    <div class="note">
      Enter your username, current password and new password.
    </div>

    <input id="username" placeholder="Username">

    <br><br>

    <input id="current_password" type="password" placeholder="Current Password">

    <br><br>

    <input id="new_password" type="password" placeholder="New Password">

    <br><br>

    <input id="confirm_password" type="password" placeholder="Confirm New Password">

    <br><br>

    <button onclick="changePassword()">Update Password</button>

    <br><br>

    <button onclick="goLogin()">Go to Login</button>

    <br><br>

    <button onclick="goRegister()">Go to Register</button>

  </div>

  <script>
    function changePassword() {
      const username = document.getElementById("username").value.trim();
      const currentPassword = document.getElementById("current_password").value.trim();
      const newPassword = document.getElementById("new_password").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value.trim();

      if (!username || !currentPassword || !newPassword || !confirmPassword) {
        alert("Please fill in all fields.");
        return;
      }

      if (newPassword.length < 6) {
        alert("New password must be at least 6 characters.");
        return;
      }

      if (newPassword !== confirmPassword) {
        alert("New password and confirm password do not match.");
        return;
      }

      fetch("/change-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          current_password: currentPassword,
          new_password: newPassword
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          window.location.href = "login.html";
        }
      })
      .catch(error => {
        console.error("Change password error:", error);
        alert("Password update failed. Please check server logs.");
      });
    }

    function goLogin() {
      window.location.href = "login.html";
    }

    function goRegister() {
      window.location.href = "register.html";
    }
  </script>

</body>
</html>
