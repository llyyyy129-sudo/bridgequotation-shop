<link rel="stylesheet" href="/static/style.css">

<h2>Shopping Cart</h2>

<div class="quotation-info">

  <input id="customerName" placeholder="Customer Name">

  <input id="customerCompany" placeholder="Customer Company">

  <input id="customerEmail" placeholder="Customer Email">

</div>

<div id="cart"></div>

<h2 id="total"></h2>

<div class="cart-buttons">
  <button onclick="downloadPDF()">Download PDF Quotation</button>
  <button onclick="checkout()">Create Order</button>
  <button onclick="clearCart()">Clear Cart</button>
  <button onclick="goBack()">Continue Shopping</button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartContainer = document.getElementById("cart");

const totalElement = document.getElementById("total");

function renderCart() {

  cartContainer.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {

    total += item.price * item.quantity;

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `
      <img src="${item.image}" class="cart-image">

      <div class="cart-info">

        <h3>${item.name}</h3>

        <p>Category: ${item.category || ""}</p>

        <p>MOQ: ${item.moq || ""}</p>

        <p>Material: ${item.material || ""}</p>

        <p>Size: ${item.size || ""}</p>

        <p>Price: $${item.price}</p>

        <p>Quantity: ${item.quantity}</p>

        <p>Total: $${item.price * item.quantity}</p>

        <button onclick="removeItem(${index})">
          Remove
        </button>

      </div>
    `;

    cartContainer.appendChild(div);

  });

  totalElement.innerText = "Grand Total: $" + total;
}

function removeItem(index) {

  cart.splice(index, 1);

  localStorage.setItem("cart", JSON.stringify(cart));

  renderCart();
}

function clearCart() {

  localStorage.removeItem("cart");

  cart = [];

  renderCart();
}

function goBack() {

  window.location.href = "products.html";
}

async function checkout() {

  const username = localStorage.getItem("user");

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const response = await fetch("/create-order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: username,
      items: cart,
      total: total
    })
  });

  const result = await response.json();

  alert(result.message);
}

async function downloadPDF() {

  const response = await fetch("/cart/pdf", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      customerName:
        document.getElementById("customerName").value,

      customerCompany:
        document.getElementById("customerCompany").value,

      customerEmail:
        document.getElementById("customerEmail").value,

      items: cart

    })
  });

  const blob = await response.blob();

  const url = window.URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;

  a.download = "quotation.pdf";

  a.click();
}

renderCart();

</script>
