<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Products List</title>
  <link rel="stylesheet" href="/static/style.css">

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .header-left {
      flex: 1;
      min-width: 320px;
    }

    .header-left h2 {
      text-align: center;
      margin-top: 0;
    }

    .customer-status-card {
      background: white;
      border-radius: 22px;
      padding: 20px 22px;
      min-width: 340px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid rgba(15, 23, 42, 0.05);
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      color: #111827;
      white-space: nowrap;
    }

    .status-label {
      color: #6b7280;
      font-weight: 600;
    }

    .status-value {
      font-weight: 800;
      color: #111827;
    }

    .sales-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef4ff;
      color: #1f3c88;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }

    .logout-small-btn {
      margin: 0;
      padding: 11px 18px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .view-cart-row {
      margin: 28px 0;
    }

    .category-buttons button {
      position: relative;
      opacity: 0.86;
    }

    .category-buttons button.active-category {
      opacity: 1;
      background: linear-gradient(135deg, #0f3fb5, #1d4ed8);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(29, 78, 216, 0.36);
      border: 2px solid rgba(255,255,255,0.95);
    }

    .category-buttons button.active-category::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 42%;
      height: 4px;
      border-radius: 999px;
      background: #1d4ed8;
      box-shadow: 0 3px 8px rgba(29, 78, 216, 0.25);
    }

    .current-category-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 14px;
      background: white;
      border-radius: 999px;
      color: #1f3c88;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
    }

    .slogan-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 18px 0;
      min-height: 32px;
    }

    .slogan-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.2px;
      border: 1px solid #fed7aa;
    }

    .slogan-badge.blue {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .slogan-badge.green {
      background: #ecfdf5;
      color: #047857;
      border-color: #bbf7d0;
    }

    .slogan-badge.purple {
      background: #f5f3ff;
      color: #6d28d9;
      border-color: #ddd6fe;
    }

    .product-card p {
      margin-bottom: 10px;
    }

    @media (max-width: 900px) {
      .page-header {
        flex-direction: column;
      }

      .customer-status-card {
        width: 100%;
        min-width: 0;
      }

      .header-left h2 {
        text-align: left;
      }
    }

    @media (max-width: 520px) {
      .customer-status-card {
        flex-direction: column;
        align-items: stretch;
      }

      .logout-small-btn {
        width: 100%;
      }

      .status-line {
        white-space: normal;
      }
    }
  </style>
</head>

<body>

  <div class="page-header">

    <div class="header-left">
      <h2>Products List</h2>

      <input
        id="searchInput"
        placeholder="Search Products name..."
        oninput="filterProducts()"
      >

      <div class="category-buttons">
        <button data-category="All" onclick="setCategory('All')">All</button>
        <button data-category="Electronics" onclick="setCategory('Electronics')">Electronics</button>
        <button data-category="Coffee" onclick="setCategory('Coffee')">Coffee</button>
        <button data-category="Storage" onclick="setCategory('Storage')">Storage</button>
        <button data-category="Bakeware" onclick="setCategory('Bakeware')">Bakeware</button>
        <button data-category="Decoration" onclick="setCategory('Decoration')">Decoration</button>
        <button data-category="Food" onclick="setCategory('Food')">Food</button>
      </div>

      <div class="current-category-title">
        Current Category:
        <span id="currentCategoryLabel">All</span>
      </div>
    </div>


    <div class="customer-status-card">
      <div class="status-info">
        <div class="status-line">
          <span class="status-label">Logged in as:</span>
          <span class="status-value" id="currentUser"></span>
        </div>

        <div class="sales-pill">
          <span>Sales Contact:</span>
          <span id="assignedSales">Loading...</span>
        </div>
      </div>

      <button class="logout-small-btn" onclick="logout()">Logout</button>
    </div>

  </div>


  <div class="view-cart-row">
    <button onclick="goCart()">View Cart</button>
  </div>

  <div id="list"></div>


<script>
let allProducts = [];
let currentCategory = "All";

const user = localStorage.getItem("user");

if (!user) {
  window.location.href = "login.html";
}

document.getElementById("currentUser").innerText = user;

const container = document.getElementById("list");

loadCustomerInfo();

fetch("/products?username=" + encodeURIComponent(user))
  .then(response => response.json())
  .then(products => {
    allProducts = products;
    updateActiveCategory();
    filterProducts();
  });


function loadCustomerInfo() {
  const fallbackSales = localStorage.getItem("assigned_sales") || "Not assigned";

  document.getElementById("assignedSales").innerText = fallbackSales;

  fetch("/customer/info/" + encodeURIComponent(user))
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        const assignedSales = data.assigned_sales || "Not assigned";

        document.getElementById("assignedSales").innerText = assignedSales;
        localStorage.setItem("assigned_sales", assignedSales);
        localStorage.setItem("customer_level", data.customer_level || "A");
      }
    })
    .catch(error => {
      console.error("Customer info error:", error);
      document.getElementById("assignedSales").innerText = fallbackSales;
    });
}


function view(id) {
  window.location.href = "product.html?id=" + id;
}


function goCart() {
  window.location.href = "cart.html";
}


function logout() {
  localStorage.removeItem("user");
  localStorage.removeItem("role");
  localStorage.removeItem("assigned_sales");
  localStorage.removeItem("company_name");
  localStorage.removeItem("email");

  alert("You have been logged out.");
  window.location.href = "login.html";
}


function setCategory(category) {
  currentCategory = category;
  updateActiveCategory();
  filterProducts();
}


function updateActiveCategory() {
  document.getElementById("currentCategoryLabel").innerText = currentCategory;

  document.querySelectorAll(".category-buttons button").forEach(button => {
    const buttonCategory = button.getAttribute("data-category");

    if (buttonCategory === currentCategory) {
      button.classList.add("active-category");
    } else {
      button.classList.remove("active-category");
    }
  });
}


function filterProducts() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allProducts.filter(p => {
    const name = (p.name || "").toLowerCase();
    const category = (p.category || "").trim().toLowerCase();

    const matchName = name.includes(keyword);

    const matchCategory =
      currentCategory === "All" ||
      category === currentCategory.toLowerCase();

    return matchName && matchCategory;
  });

  renderProducts(filtered);
}


function getProductSlogan(product, index) {
  const category = (product.category || "").trim().toLowerCase();

  if (product.slogan) {
    return product.slogan;
  }

  if (category === "storage") {
    return index % 2 === 0 ? "Space Saving" : "Hot Selling";
  }

  if (category === "electronics") {
    return index % 2 === 0 ? "New Arrival" : "Special Price";
  }

  if (category === "coffee") {
    return index % 2 === 0 ? "Premium Choice" : "Best Seller";
  }

  if (category === "bakeware") {
    return index % 2 === 0 ? "Kitchen Essential" : "Hot Selling";
  }

  if (category === "decoration") {
    return index % 2 === 0 ? "Elegant Design" : "Gift Pick";
  }

  if (category === "food") {
    return index % 2 === 0 ? "Daily Use" : "Special Price";
  }

  const slogans = [
    "Hot Selling",
    "Special Price",
    "New Arrival",
    "Best Seller",
    "Recommended"
  ];

  return slogans[index % slogans.length];
}


function getSloganColor(index) {
  const colors = ["", "blue", "green", "purple"];
  return colors[index % colors.length];
}


function renderProducts(products) {
  container.innerHTML = "";

  products.forEach((p, index) => {
    const div = document.createElement("div");
    div.className = "product-card";

    const slogan = getProductSlogan(p, index);
    const sloganColor = getSloganColor(index);

    div.innerHTML = `
      <img src="${p.image}" class="product-image">
      <h3>${p.name}</h3>
      <p>Price: $${p.price}</p>

      <div class="slogan-row">
        <span class="slogan-badge ${sloganColor}">
          ${slogan}
        </span>
      </div>

      <button onclick="view(${p.id})">View Details</button>
    `;

    container.appendChild(div);
  });
}
</script>

</body>
</html>
