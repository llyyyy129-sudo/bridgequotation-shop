<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">

  <style>
    .center-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #eef4ff;
      color: #1f3c88;
      border: 1px solid #bfdbfe;
      padding: 16px 26px;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      max-width: min(520px, 86vw);
      word-break: break-word;
      text-align: center;
      display: none;
      z-index: 99999;
    }
  </style>
</head>

<body>

  <div id="centerToast" class="center-toast"></div>

  <main class="auth-shell">

    <section class="brand-side">
      <img class="brand-image" src="/static/image/auth_background.jpg" alt="Ningbo Future Houseware Bridge">

      <h1 class="brand-title">
        Bridge Quotation<br>
        System
      </h1>

      <p class="brand-desc">
        Manage quotations, product requests, shared carts and customer approvals in one secure workspace.
      </p>
    </section>


    <section class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>

      <div class="field">
        <label>Username</label>
        <input id="username" placeholder="Enter username">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
      </div>

      <button class="btn btn-primary" onclick="login()">Login</button>
      <button class="btn btn-outline" onclick="goRegister()">Go to Register</button>
      <button class="btn btn-outline" onclick="goChangePassword()">Change My Password</button>
    </section>

  </main>


  <script>
    function showCenterMessage(message) {
      const toast = document.getElementById("centerToast");

      if (!toast) {
        return;
      }

      toast.innerText = message;
      toast.style.display = "block";

      if (window.centerToastTimer) {
        clearTimeout(window.centerToastTimer);
      }

      window.centerToastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 1700);
    }


    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const sharedCart = localStorage.getItem("sharedCart");

      if (!username || !password) {
        showCenterMessage("Please enter username and password.");
        return;
      }

      fetch("/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      })
      .then(response => response.json())
      .then(data => {

        if (!data.success) {
          if (
            data.approval_status === "Pending" ||
            data.approval_status === "Rejected"
          ) {
            localStorage.setItem("status_username", data.username || username);
            localStorage.setItem("status_company_name", data.company_name || "");
            localStorage.setItem("status_email", data.email || "");
            localStorage.setItem("status_account_type", data.account_type || "");
            localStorage.setItem("status_approval_status", data.approval_status || "");
            localStorage.setItem("status_message", data.message || "");

            window.location.href = "account_status.html";
            return;
          }

          showCenterMessage(data.message || "Invalid username or password.");
          return;
        }

        localStorage.setItem("user", data.username);
        localStorage.setItem("role", data.role);
        localStorage.setItem("assigned_sales", data.assigned_sales || "");
        localStorage.setItem("company_name", data.company_name || "");
        localStorage.setItem("email", data.email || "");

        if (data.role === "admin") {
          window.location.href = "admin.html";
          return;
        }

        if (sharedCart) {
          localStorage.setItem("cart", sharedCart);
          localStorage.removeItem("sharedCart");
          window.location.href = "cart.html";
          return;
        }

        if (data.role === "sales") {
          window.location.href = "sales.html";
        } else {
          window.location.href = "products.html";
        }
      })
      .catch(error => {
        console.error("Login error:", error);
        showCenterMessage("Login failed. Please check server logs.");
      });
    }

    function goRegister() {
      window.location.href = "register.html";
    }

    function goChangePassword() {
      window.location.href = "change_password.html";
    }
  </script>

</body>
</html>
