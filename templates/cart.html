<link rel="stylesheet" href="/static/style.css">

<style>
  .packing-edit-row {
    margin: 10px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .packing-edit-row label {
    font-weight: 800;
  }

  .packing-value {
    display: inline-flex;
    align-items: center;
    min-height: 38px;
    padding: 8px 14px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    color: #111827;
    font-weight: 700;
  }

  .cart-requirements-box {
    margin: 12px 0;
    padding: 14px;
    border-radius: 16px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
  }

  .cart-requirements-box label {
    display: block;
    font-weight: 800;
    color: #111827;
    margin-bottom: 7px;
  }

  .cart-requirements-box .hint {
    color: #6b7280;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 9px;
  }

  .cart-requirements-textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    border: 1.5px solid #d7dce7;
    border-radius: 14px;
    padding: 11px 13px;
    font-size: 15px;
    line-height: 1.5;
    background: white;
    outline: none;
  }

  .cart-requirements-textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  }

  .cart-action-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .detail-btn {
    background: #1f3c88;
  }

  .cart-requirement-note {
    margin: 8px 0 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    color: #374151;
    line-height: 1.5;
  }

  .quotation-hint {
    width: 100%;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-top: 6px;
  }

  .my-order-details {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #ffffff;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .my-order-details summary {
    cursor: pointer;
    padding: 14px 16px;
    list-style: none;
  }

  .my-order-details summary::-webkit-details-marker {
    display: none;
  }

  .my-order-summary {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .my-order-main {
    line-height: 1.6;
  }

  .my-order-time {
    color: #6b7280;
    font-size: 13px;
  }

  .my-order-toggle {
    color: #1f3c88;
    font-weight: 800;
    white-space: nowrap;
  }

  .my-order-items {
    border-top: 1px solid #e5e7eb;
    padding: 12px 16px 16px;
    background: #fafbff;
  }

  .order-item-row {
    padding: 10px 0;
    border-bottom: 1px solid #e5e7eb;
    line-height: 1.7;
  }

  .order-item-row:last-child {
    border-bottom: none;
  }

  .order-item-name {
    font-weight: 800;
    color: #111827;
  }


    .center-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #eef4ff;
      color: #1f3c88;
      border: 1px solid #bfdbfe;
      padding: 16px 26px;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      max-width: min(520px, 86vw);
      word-break: break-word;
      text-align: center;
      display: none;
      z-index: 99999;
    }

</style>

<div id="centerToast" class="center-toast"></div>

<h2>Shopping Cart</h2>
<div class="quotation-info">
  <input id="customerName" placeholder="Customer Name">
  <input id="customerCompany" placeholder="Customer Company">
  <input id="customerEmail" placeholder="Customer Email">
  <input id="validDays" type="number" min="1" value="30" placeholder="Valid Days">
  <div class="quotation-hint">
    These fields are filled from your registered account. You can still edit them before downloading the PDF quotation.
  </div>
</div>

<div id="cart"></div>

<h2 id="total"></h2>

<div class="cart-buttons">
  <button onclick="goMyOrders()">My Orders</button>

  <button onclick="downloadPDF()">Download PDF Quotation</button>

  <button onclick="checkout()">Create Order</button>

  <button onclick="shareCart()">Share Cart Link</button>

  <button onclick="clearCart()">Clear Cart</button>

  <button onclick="goBack()">Continue Shopping</button>
</div>

<script>

function showCenterMessage(message) {
  const toast = document.getElementById("centerToast");

  if (!toast) {
    return;
  }

  toast.innerText = message;
  toast.style.display = "block";

  if (window.centerToastTimer) {
    clearTimeout(window.centerToastTimer);
  }

  window.centerToastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 1700);
}


let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartContainer = document.getElementById("cart");
const totalElement = document.getElementById("total");

async function fillCustomerInfo() {
  const username = localStorage.getItem("user") || "";
  const savedCompany = localStorage.getItem("company_name") || "";
  const savedEmail = localStorage.getItem("email") || "";

  document.getElementById("customerName").value = username;
  document.getElementById("customerCompany").value = savedCompany;
  document.getElementById("customerEmail").value = savedEmail;

  if (!username) {
    return;
  }

  try {
    const response = await fetch(
      "/customer/info/" + encodeURIComponent(username)
    );

    const data = await response.json();

    if (data.success) {
      document.getElementById("customerName").value =
        data.username || username;

      document.getElementById("customerCompany").value =
        data.company_name || savedCompany;

      document.getElementById("customerEmail").value =
        data.email || savedEmail;

      localStorage.setItem("company_name", data.company_name || "");
      localStorage.setItem("email", data.email || "");
    }

  } catch (error) {
    console.error("Customer info load failed:", error);
  }
}

function getTierPrice(quantity, item) {
  let unitPrice = item.price;

  if (quantity >= 50000 && item.price_50000) {
    unitPrice = item.price_50000;
  }
  else if (quantity >= 10000 && item.price_10000) {
    unitPrice = item.price_10000;
  }
  else if (quantity >= 3000 && item.price_3000) {
    unitPrice = item.price_3000;
  }
  else if (quantity >= 1000 && item.price_1000) {
    unitPrice = item.price_1000;
  }
  else if (quantity >= 500 && item.price_500) {
    unitPrice = item.price_500;
  }

  return Number(unitPrice);
}

function getTierLabel(quantity) {
  if (quantity >= 50000) return "50000+";
  if (quantity >= 10000) return "10000+";
  if (quantity >= 3000) return "3000+";
  if (quantity >= 1000) return "1000+";
  if (quantity >= 500) return "500+";
  return "Base";
}

function money(value) {
  return Number(value).toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function renderCart() {
  cartContainer.innerHTML = "";

  let grandTotal = 0;

  cart.forEach((item, index) => {
    const unitPrice = getTierPrice(item.quantity, item);
    const lineTotal = unitPrice * item.quantity;

    item.price = unitPrice;

    grandTotal += lineTotal;

    const div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <img src="${item.image}" class="cart-image">

      <div class="cart-info">
        <h3>${escapeHtml(item.name)}</h3>

        <p>Category: ${escapeHtml(item.category || "")}</p>
        <p>MOQ: ${escapeHtml(item.moq || "")}</p>
        <p>Material: ${escapeHtml(item.material || "")}</p>
        <p>Size: ${escapeHtml(item.size || "")}</p>

        <div class="packing-edit-row">
          <label>Packing:</label>
          <span class="packing-value">
            ${escapeHtml(item.packing || "Not specified")}
          </span>
        </div>

        <div class="cart-requirements-box">
          <label>Customer Requirements</label>
          <div class="hint">
            You can change the customer's special requests here, such as packing, size, color, label, artwork, shipping mark or other requirements.
          </div>

          <textarea
            class="cart-requirements-textarea"
            placeholder="Example: Please quote color box packing. Need black color. Please check if size can be 20 x 15 cm."
            onchange="updateRequirement(${index}, this.value)"
            oninput="updateRequirement(${index}, this.value)"
          >${escapeHtml(item.customer_requirement || "")}</textarea>
        </div>

        <p><b>Price Tier:</b> ${getTierLabel(item.quantity)}</p>
        <p><b>Unit Price:</b> $${money(unitPrice)}</p>

        <p>
          <b>Quantity:</b>
          <input
            type="number"
            min="${item.moq}"
            value="${item.quantity}"
            onchange="updateQuantity(${index}, this.value)"
            style="width:100px;"
          >
        </p>

        <p><b>Line Total:</b> $${money(lineTotal)}</p>

        <div class="cart-action-row">
          <button class="detail-btn" onclick="viewDetail(${item.id})">View Details</button>
          <button onclick="removeItem(${index})">Remove</button>
        </div>
      </div>
    `;

    cartContainer.appendChild(div);
  });

  localStorage.setItem("cart", JSON.stringify(cart));

  totalElement.innerText = "Grand Total: $" + money(grandTotal);
}

function viewDetail(productId) {
  window.location.href = "product.html?id=" + productId;
}


function updateRequirement(index, value) {
  cart[index].customer_requirement = value.trim();
  localStorage.setItem("cart", JSON.stringify(cart));
}


function updateQuantity(index, value) {

  const item = cart[index];

  let quantity = parseInt(value);

  if (quantity < item.moq || isNaN(quantity)) {
    showCenterMessage(`Minimum Order Quantity is ${item.moq}`);
    quantity = item.moq;
  }

  const newPrice = getTierPrice(quantity, item);

  cart[index].quantity = quantity;
  cart[index].price = newPrice;

  localStorage.setItem("cart", JSON.stringify(cart));

  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function clearCart() {
  localStorage.removeItem("cart");
  cart = [];
  renderCart();
}

function goBack() {
  window.location.href = "products.html";
}

function goMyOrders() {
  window.location.href = "my_orders.html";
}

async function checkout() {
  const username = localStorage.getItem("user");

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const response = await fetch("/create-order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: username,
      items: cart,
      total: total
    })
  });

  const result = await response.json();

  if (!result.success) {
    showCenterMessage(result.message || "Create order failed.");
    return;
  }

  showCenterMessage(result.message || "Order created successfully!");
}

async function downloadPDF() {
  const response = await fetch("/cart/pdf", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: localStorage.getItem("user"),
      customerName: document.getElementById("customerName").value,
      customerCompany: document.getElementById("customerCompany").value,
      customerEmail: document.getElementById("customerEmail").value,
      validDays: document.getElementById("validDays").value || 30,
      items: cart
    })
  });

  const blob = await response.blob();
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "quotation.pdf";
  a.click();
}

function shareCart() {

    if(cart.length === 0){
        showCenterMessage("Cart is empty");
        return;
    }

    const cartString = encodeURIComponent(
        JSON.stringify(cart)
    );

    const shareLink =
        window.location.origin +
        "/share.html?cart=" +
        cartString;

    navigator.clipboard.writeText(shareLink);

    showCenterMessage("Share cart link copied.");
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

fillCustomerInfo();
renderCart();
</script>
