<link rel="stylesheet" href="/static/style.css">

<h2>Shopping Cart</h2>

<button onclick="goProducts()">Keep Shopping</button>
<button onclick="checkout()">Checkout</button>

<br><br>

<button onclick="shareCart()">Generate Share Link</button>

<div id="cart"></div>

<h3 id="total"></h3>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartDiv = document.getElementById("cart");
const totalDiv = document.getElementById("total");

function renderCart() {
  cartDiv.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {
    const quantity = item.quantity || 1;
    total += item.price * quantity;

    const div = document.createElement("div");

    div.innerHTML = `
      <div class="cart-item">

        <img src="${item.image}" class="cart-image">

        <div class="cart-info">
          <h3>${item.name}</h3>

          <p>Price: $${item.price}</p>

          <p>
            Quantity:
            <input 
              type="number" 
              value="${quantity}" 
              min="1"
              onchange="updateQuantity(${index}, this.value)"
            >
          </p>

          <button onclick="increase(${index})">+</button>
          <button onclick="decrease(${index})">-</button>
          <button onclick="removeItem(${index})">Delete</button>
        </div>

      </div>
    `;

    cartDiv.appendChild(div);
  });

  totalDiv.innerText = "Total: $" + total;

  localStorage.setItem("cart", JSON.stringify(cart));
}

function increase(index) {
  cart[index].quantity = (cart[index].quantity || 1) + 1;
  renderCart();
}

function decrease(index) {
  cart[index].quantity = (cart[index].quantity || 1) - 1;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  renderCart();
}

function updateQuantity(index, value) {
  let quantity = parseInt(value);

  if (isNaN(quantity) || quantity < 1) {
    quantity = 1;
  }

  cart[index].quantity = quantity;

  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  renderCart();
}

function goProducts() {
  window.location.href = "products.html";
}

function checkout() {
  const user = localStorage.getItem("user");

  fetch("/create-order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: user,
      items: cart,
      total: cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0)
    })
  })
  .then(response => response.json())
  .then(data => {
    alert(data.message);

    if (data.success) {
      localStorage.removeItem("cart");
      window.location.href = "products.html";
    }
  });
}

function shareCart() {
  const encoded = encodeURIComponent(JSON.stringify(cart));

  const link = window.location.origin + "/share.html?cart=" + encoded;

  navigator.clipboard.writeText(link);

  alert("Share link copied!");
}

renderCart();
</script>
