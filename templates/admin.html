<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin User Approval</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            font-family: "Century Gothic", CenturyGothic, AppleGothic, Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 35px;
            color: #222;
        }

        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            background: white;
            border-radius: 14px;
            padding: 22px 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .top-bar h1 {
            margin: 0;
            color: #1f3c88;
            font-size: 30px;
        }

        .admin-info {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .my-password-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn {
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 26px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
            color: #1f3c88;
        }

        details.user-section {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 26px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        details.user-section summary {
            cursor: pointer;
            font-size: 22px;
            font-weight: bold;
            color: #1f3c88;
        }

        .user-list {
            margin-top: 22px;
        }

        .user-card {
            border: 1px solid #e2e5ec;
            border-radius: 12px;
            padding: 18px 20px;
            background: #fafbff;
            margin-bottom: 16px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .user-card.processing {
            opacity: 0.55;
            transform: scale(0.99);
        }

        .user-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .user-info {
            line-height: 1.8;
            font-size: 15px;
        }

        .button-row {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .approve-btn {
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .reject-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .password-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn {
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .empty-message {
            color: #777;
            background: #f8f9fc;
            border-radius: 10px;
            padding: 16px;
        }

        .status-approved {
            color: #4caf50;
            font-weight: bold;
        }

        .status-pending {
            color: #ff9800;
            font-weight: bold;
        }

        .status-rejected {
            color: #f44336;
            font-weight: bold;
        }

        .pricing-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 12px;
        }

        .pricing-input {
            width: 160px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #ccd3df;
            padding: 0 10px;
            background: white;
            font-size: 14px;
        }

        .level-pill {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: #eef4ff;
            color: #1f3c88;
            font-weight: 800;
            margin-left: 6px;
        }

        .assign-box {
            margin-top: 14px;
            background: #f8f9fc;
            border: 1px solid #e2e5ec;
            border-radius: 10px;
            padding: 14px;
        }

        .assign-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
        }

        .sales-select {
            min-width: 220px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #ccd3df;
            padding: 0 10px;
            background: white;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            left: 50%;
            top: 32px;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.84);
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 15px;
            display: none;
            z-index: 9999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.22);
        }
    </style>
</head>

<body>

<div class="admin-page">

    <div class="top-bar">
        <div>
            <h1>Admin Dashboard</h1>
            <div class="admin-info">
                Current Admin: <b id="adminName"></b>
            </div>
        </div>

        <div class="top-actions">
            <button class="my-password-btn" onclick="changeMyPassword()">
                Change My Password
            </button>

            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>


    <div class="section">
        <h2>Pricing Settings</h2>

        <div>
            A Class customers see Excel prices directly.
            B Class customers see Excel prices multiplied by the percentage below.
        </div>

        <div class="pricing-row">
            <label><b>B Class Price:</b></label>
            <input
                id="bClassPercent"
                class="pricing-input"
                type="number"
                min="100"
                max="300"
                step="1"
                value="120"
            >
            <span>%</span>

            <button class="save-btn" onclick="savePricingSetting()">
                Save Pricing
            </button>
        </div>
    </div>


    <div class="section">
        <h2 id="pendingTitle">Pending User Approval (0)</h2>
        <div id="pendingUsers"></div>
    </div>


    <details class="user-section">
        <summary id="customerUsersTitle">Customer Users (0)</summary>
        <div id="customerUsers" class="user-list"></div>
    </details>


    <details class="user-section">
        <summary id="salesUsersTitle">Sales Users (0)</summary>
        <div id="salesUsers" class="user-list"></div>
    </details>

</div>

<div id="toast" class="toast"></div>


<script>
const currentUser = localStorage.getItem("user");
const currentRole = localStorage.getItem("role");

let allUsersCache = [];
let salesUsersCache = [];

document.getElementById("adminName").innerText = currentUser || "Unknown";

if (!currentUser) {
    alert("Please login first.");
    window.location.href = "login.html";
}

if (currentRole !== "admin") {
    alert("Only admin can access this page.");
    window.location.href = "login.html";
}


async function loadAdminUsers() {
    await loadPricingSettings();
    await loadSalesOptions();
    await loadPendingUsers();
    await loadUserGroups();
}


async function loadPricingSettings() {
    try {
        const response = await fetch("/admin/pricing");
        const data = await response.json();

        if (data.success) {
            document.getElementById("bClassPercent").value =
                Number(data.b_percentage || 120);
        }

    } catch (error) {
        console.error("Load pricing settings error:", error);
    }
}


async function savePricingSetting() {
    const percentage = Number(document.getElementById("bClassPercent").value);

    if (!percentage || percentage < 100) {
        alert("B Class percentage must be 100 or above.");
        return;
    }

    try {
        const response = await fetch("/admin/pricing", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                b_percentage: percentage
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message || "Failed to update pricing.");
            return;
        }

        showToast(data.message);

    } catch (error) {
        console.error("Save pricing setting error:", error);
        alert("Failed to update pricing. Please check server logs.");
    }
}


async function loadSalesOptions() {
    const response = await fetch("/admin/sales-users");
    salesUsersCache = await response.json();
}


async function loadPendingUsers() {
    const response = await fetch("/admin/users/pending");
    const users = await response.json();

    const visibleUsers = users.filter(user => user.username !== "orange");

    document.getElementById("pendingTitle").innerText =
        "Pending User Approval (" + visibleUsers.length + ")";

    const container = document.getElementById("pendingUsers");
    container.innerHTML = "";

    if (visibleUsers.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No pending users.
            </div>
        `;
        return;
    }

    visibleUsers.forEach(user => {
        container.innerHTML += `
            <div class="user-card" id="user-card-${user.id}">
                <div class="user-title">
                    User #${user.id} - ${escapeHtml(user.username)}
                </div>

                <div class="user-info">
                    Account Type: <b>${formatAccountType(user.account_type)}</b><br>
                    Company: <b>${escapeHtml(user.company_name || "")}</b><br>
                    Email: <b>${escapeHtml(user.email || "")}</b><br>
                    Role After Approval: <b>${escapeHtml(user.role || "")}</b><br>
                    Status: <span class="status-pending">${escapeHtml(user.approval_status || "")}</span>
                </div>

                <div class="button-row">
                    <button class="approve-btn" onclick="approveUser(${user.id})">
                        Approve
                    </button>

                    <button class="reject-btn" onclick="rejectUser(${user.id})">
                        Reject
                    </button>

                    ${renderDeleteButton(user)}
                </div>
            </div>
        `;
    });
}


async function loadUserGroups() {
    const response = await fetch("/admin/users");
    const users = await response.json();

    allUsersCache = users.filter(user => user.username !== "orange");

    const customerUsers = allUsersCache.filter(user =>
        user.role === "customer" || user.account_type === "customer"
    );

    const salesUsers = allUsersCache.filter(user =>
        user.role === "sales" || user.account_type === "employee"
    );

    document.getElementById("customerUsersTitle").innerText =
        "Customer Users (" + customerUsers.length + ")";

    document.getElementById("salesUsersTitle").innerText =
        "Sales Users (" + salesUsers.length + ")";

    renderCustomerUsers(customerUsers);
    renderSalesUsers(salesUsers);
}


function renderCustomerUsers(users) {
    const container = document.getElementById("customerUsers");
    container.innerHTML = "";

    if (users.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No customer users.
            </div>
        `;
        return;
    }

    users.forEach(user => {
        container.innerHTML += `
            <div class="user-card" id="all-user-card-${user.id}">
                <div class="user-title">
                    User #${user.id} - ${escapeHtml(user.username)}
                </div>

                <div class="user-info">
                    Account Type: <b>${formatAccountType(user.account_type)}</b><br>
                    Company: <b>${escapeHtml(user.company_name || "")}</b><br>
                    Email: <b>${escapeHtml(user.email || "")}</b><br>
                    Role: <b>${escapeHtml(user.role || "")}</b><br>
                    Customer Level: <span class="level-pill">${escapeHtml(user.customer_level || "A")}</span><br>
                    Assigned Sales: <b>${escapeHtml(user.assigned_sales || "Not assigned")}</b><br>
                    Status: ${formatStatus(user.approval_status)}
                </div>

                ${renderCustomerLevelBox(user)}
                ${renderAssignSalesBox(user)}

                <div class="button-row">
                    ${renderChangePasswordButton(user)}
                    ${renderDeleteButton(user)}
                </div>
            </div>
        `;
    });
}


function renderSalesUsers(users) {
    const container = document.getElementById("salesUsers");
    container.innerHTML = "";

    if (users.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No sales users.
            </div>
        `;
        return;
    }

    users.forEach(user => {
        container.innerHTML += `
            <div class="user-card" id="all-user-card-${user.id}">
                <div class="user-title">
                    User #${user.id} - ${escapeHtml(user.username)}
                </div>

                <div class="user-info">
                    Account Type: <b>${formatAccountType(user.account_type)}</b><br>
                    Company: <b>${escapeHtml(user.company_name || "")}</b><br>
                    Email: <b>${escapeHtml(user.email || "")}</b><br>
                    Role: <b>${escapeHtml(user.role || "")}</b><br>
                    Status: ${formatStatus(user.approval_status)}
                </div>

                <div class="button-row">
                    ${renderChangePasswordButton(user)}
                    ${renderDeleteButton(user)}
                </div>
            </div>
        `;
    });
}


function renderCustomerLevelBox(user) {
    if (user.role !== "customer") {
        return "";
    }

    if (user.approval_status !== "Approved") {
        return "";
    }

    const currentLevel = user.customer_level || "A";

    return `
        <div class="assign-box">
            <b>Customer Level</b>

            <div class="assign-row">
                <select class="sales-select" id="customer-level-${user.id}">
                    <option value="A" ${currentLevel === "A" ? "selected" : ""}>
                        A Class - Excel Price
                    </option>
                    <option value="B" ${currentLevel === "B" ? "selected" : ""}>
                        B Class - Adjusted Price
                    </option>
                </select>

                <button class="save-btn" onclick="updateCustomerLevel(${user.id})">
                    Save Level
                </button>
            </div>
        </div>
    `;
}


async function updateCustomerLevel(userId) {
    const select = document.getElementById("customer-level-" + userId);
    const customerLevel = select.value;

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/customers/" + userId + "/level",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    customer_level: customerLevel
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Level update failed.");
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Update customer level error:", error);
        alert("Level update failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


function renderAssignSalesBox(user) {
    if (user.role !== "customer") {
        return "";
    }

    if (user.approval_status !== "Approved") {
        return "";
    }

    if (!salesUsersCache || salesUsersCache.length === 0) {
        return `
            <div class="assign-box">
                <b>Assign Sales</b><br>
                <span style="color:#777;">No approved sales users available.</span>
            </div>
        `;
    }

    let options = salesUsersCache.map(sales => {
        const selected = sales.username === user.assigned_sales ? "selected" : "";

        return `
            <option value="${escapeHtml(sales.username)}" ${selected}>
                ${escapeHtml(sales.username)}
            </option>
        `;
    }).join("");

    return `
        <div class="assign-box">
            <b>Assign Sales</b>

            <div class="assign-row">
                <select class="sales-select" id="assign-sales-${user.id}">
                    <option value="">Choose sales</option>
                    ${options}
                </select>

                <button class="save-btn" onclick="assignSales(${user.id})">
                    Save Assignment
                </button>
            </div>
        </div>
    `;
}


function renderChangePasswordButton(user) {
    if (user.approval_status !== "Approved") {
        return "";
    }

    return `
        <button class="password-btn" onclick="changePassword(${user.id}, '${escapeForJs(user.username)}')">
            Change Password
        </button>
    `;
}


function renderDeleteButton(user) {
    if (user.username === "orange") {
        return "";
    }

    return `
        <button class="delete-btn" onclick="deleteUser(${user.id}, '${escapeForJs(user.username)}')">
            Delete Account
        </button>
    `;
}


function formatAccountType(type) {
    if (type === "employee") {
        return "Employee";
    }

    return "Customer";
}


function formatStatus(status) {
    if (status === "Approved") {
        return `<span class="status-approved">Approved</span>`;
    }

    if (status === "Rejected") {
        return `<span class="status-rejected">Rejected</span>`;
    }

    return `<span class="status-pending">Pending</span>`;
}


function setProcessing(userId, processing) {
    const cards = [
        document.getElementById("user-card-" + userId),
        document.getElementById("all-user-card-" + userId)
    ];

    cards.forEach(card => {
        if (!card) return;

        if (processing) {
            card.classList.add("processing");
        } else {
            card.classList.remove("processing");
        }

        const buttons = card.querySelectorAll("button");
        buttons.forEach(button => {
            button.disabled = processing;
        });
    });
}


async function approveUser(userId) {
    const ok = confirm("Approve this user?");

    if (!ok) return;

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/users/" + userId + "/approve",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Operation failed. Please check server logs.");
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Approve error:", error);
        alert("Approve failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


async function rejectUser(userId) {
    const ok = confirm("Reject this user?");

    if (!ok) return;

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/users/" + userId + "/reject",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Operation failed. Please check server logs.");
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Reject error:", error);
        alert("Reject failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


async function assignSales(userId) {
    const select = document.getElementById("assign-sales-" + userId);
    const salesUsername = select.value;

    if (!salesUsername) {
        alert("Please choose a sales user.");
        return;
    }

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/customers/" + userId + "/assign-sales",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    sales_username: salesUsername
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Assignment failed.");
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Assign sales error:", error);
        alert("Assignment failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


async function changePassword(userId, username) {
    const newPassword = prompt(
        "Enter new password for: " + username + "\\n\\nPassword must be at least 6 characters."
    );

    if (newPassword === null) return;

    const password = newPassword.trim();

    if (!password) {
        alert("Password cannot be empty.");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/users/" + userId + "/change-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Password update failed. Please check server logs.");
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Change password error:", error);
        alert("Password update failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


async function deleteUser(userId, username) {
    const ok = confirm(
        "Delete account: " + username + "?\\n\\nThis will remove this user from the user list."
    );

    if (!ok) return;

    setProcessing(userId, true);

    try {
        const response = await fetch(
            "/admin/users/" + userId + "/delete",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Operation failed. Please check server logs.");
            setProcessing(userId, false);
            return;
        }

        await loadAdminUsers();
        showToast(data.message);

    } catch (error) {
        console.error("Delete error:", error);
        alert("Delete failed. Please check server logs.");
        setProcessing(userId, false);
    }
}


async function changeMyPassword() {
    const currentPassword = prompt("Enter your current password:");

    if (currentPassword === null) return;

    if (!currentPassword.trim()) {
        alert("Current password cannot be empty.");
        return;
    }

    const newPassword = prompt("Enter your new password. Password must be at least 6 characters:");

    if (newPassword === null) return;

    if (!newPassword.trim()) {
        alert("New password cannot be empty.");
        return;
    }

    if (newPassword.trim().length < 6) {
        alert("New password must be at least 6 characters.");
        return;
    }

    try {
        const response = await fetch(
            "/change-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: currentUser,
                    current_password: currentPassword.trim(),
                    new_password: newPassword.trim()
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || data.detail || "Password update failed.");
            return;
        }

        alert(data.message);
        logout();

    } catch (error) {
        console.error("Change my password error:", error);
        alert("Password update failed. Please check server logs.");
    }
}


function showToast(message) {
    const toast = document.getElementById("toast");

    toast.innerText = message;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 1800);
}


function escapeForJs(value) {
    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function logout() {
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    localStorage.removeItem("assigned_sales");
    localStorage.removeItem("company_name");
    localStorage.removeItem("email");
    window.location.href = "login.html";
}


loadAdminUsers();
</script>
