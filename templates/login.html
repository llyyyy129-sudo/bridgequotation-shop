<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="auth-page">

  <div class="box">

    <h2>Login</h2>

    <input id="username" placeholder="Username">

    <br><br>

    <input id="password" type="password" placeholder="Password">

    <br><br>

    <button onclick="login()">Login</button>

    <br><br>

    <button onclick="goRegister()">Go to Register</button>

  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const sharedCart = localStorage.getItem("sharedCart");

      if (!username || !password) {
        alert("Please enter username and password.");
        return;
      }

      fetch("/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      })
      .then(response => response.json())
      .then(data => {

        if (!data.success) {
          if (
            data.approval_status === "Pending" ||
            data.approval_status === "Rejected"
          ) {
            localStorage.setItem("status_username", data.username || username);
            localStorage.setItem("status_company_name", data.company_name || "");
            localStorage.setItem("status_email", data.email || "");
            localStorage.setItem("status_account_type", data.account_type || "");
            localStorage.setItem("status_approval_status", data.approval_status || "");
            localStorage.setItem("status_message", data.message || "");

            window.location.href = "account_status.html";
            return;
          }

          alert(data.message);
          return;
        }

        localStorage.setItem("user", data.username);
        localStorage.setItem("role", data.role);
        localStorage.setItem("assigned_sales", data.assigned_sales || "");
        localStorage.setItem("company_name", data.company_name || "");
        localStorage.setItem("email", data.email || "");

        if (data.role === "admin") {
          window.location.href = "admin.html";
          return;
        }

        if (sharedCart) {
          localStorage.setItem("cart", sharedCart);
          localStorage.removeItem("sharedCart");
          window.location.href = "cart.html";
          return;
        }

        if (data.role === "sales") {
          window.location.href = "sales.html";
        } else {
          window.location.href = "products.html";
        }
      })
      .catch(error => {
        console.error("Login error:", error);
        alert("Login failed. Please check server logs.");
      });
    }

    function goRegister() {
      window.location.href = "register.html";
    }
  </script>

</body>
</html>
