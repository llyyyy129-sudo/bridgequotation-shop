<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>

<body>

  <main class="auth-shell">

    <section class="brand-side">
      <img class="brand-image" src="/static/image/auth_background.jpg" alt="Ningbo Future Houseware Bridge">

      <h1 class="brand-title">
        Bridge Quotation<br>
        System
      </h1>

      <p class="brand-desc">
        Change your password securely using your current username and password.
      </p>
    </section>


    <section class="auth-card">
      <h2 class="auth-title">Change Password</h2>

      <div class="field">
        <label>Username</label>
        <input id="username" placeholder="Enter username">
      </div>

      <div class="field">
        <label>Current Password</label>
        <input id="current_password" type="password" placeholder="Enter current password">
      </div>

      <div class="field">
        <label>New Password</label>
        <input id="new_password" type="password" placeholder="At least 6 characters">
      </div>

      <div class="field">
        <label>Confirm New Password</label>
        <input id="confirm_password" type="password" placeholder="Confirm new password">
      </div>

      <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
      <button class="btn btn-outline" onclick="goLogin()">Go to Login</button>
      <button class="btn btn-outline" onclick="goRegister()">Go to Register</button>
    </section>

  </main>


  <script>
    function changePassword() {
      const username = document.getElementById("username").value.trim();
      const currentPassword = document.getElementById("current_password").value.trim();
      const newPassword = document.getElementById("new_password").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value.trim();

      if (!username || !currentPassword || !newPassword || !confirmPassword) {
        alert("Please fill in all fields.");
        return;
      }

      if (newPassword.length < 6) {
        alert("New password must be at least 6 characters.");
        return;
      }

      if (newPassword !== confirmPassword) {
        alert("New password and confirm password do not match.");
        return;
      }

      fetch("/change-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          current_password: currentPassword,
          new_password: newPassword
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          window.location.href = "login.html";
        }
      })
      .catch(error => {
        console.error("Change password error:", error);
        alert("Password update failed. Please check server logs.");
      });
    }

    function goLogin() {
      window.location.href = "login.html";
    }

    function goRegister() {
      window.location.href = "register.html";
    }
  </script>

</body>
</html>
