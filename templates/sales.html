<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            font-family: "Century Gothic", CenturyGothic, AppleGothic, Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 35px;
            color: #222;
        }

        .sales-page {
            max-width: 1050px;
            margin: 0 auto;
        }

        .top-bar {
            background: white;
            border-radius: 14px;
            padding: 22px 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .top-bar h1 {
            margin: 0;
            color: #1f3c88;
            font-size: 30px;
        }

        .sales-info {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        details.order-section {
            background: white;
            border-radius: 16px;
            padding: 0;
            margin-bottom: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        details.order-section summary {
            list-style: none;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            padding: 24px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        details.order-section summary::-webkit-details-marker {
            display: none;
        }

        .summary-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .summary-arrow {
            font-size: 18px;
            color: #666;
            transition: transform 0.2s ease;
        }

        details[open] .summary-arrow {
            transform: rotate(90deg);
        }

        .section-content {
            padding: 0 28px 24px 28px;
        }

        .section-line {
            border: none;
            border-top: 1px solid #ddd;
            margin: 0 0 18px 0;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .order-box {
            border: 1px solid #e2e5ec;
            border-radius: 12px;
            padding: 18px 20px;
            background: #fafbff;
        }

        .order-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .order-info {
            line-height: 1.8;
            font-size: 15px;
        }

        .button-row {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .confirm-btn {
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .return-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .return-btn:disabled {
            background: #fca5a5;
            cursor: not-allowed;
        }

        .return-comment-box {
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: white;
        }

        .return-comment-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #111827;
        }

        .return-comment-box textarea {
            width: 100%;
            min-height: 82px;
            resize: vertical;
            border: 1.5px solid #d7dce7;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.5;
            box-sizing: border-box;
            outline: none;
        }

        .return-comment-box textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .status-text {
            margin-top: 12px;
            font-weight: bold;
        }

        .confirmed-text {
            color: #4caf50;
        }

        .returned-text {
            color: #f44336;
        }

        .return-reason {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff1f2;
            color: #b91c1c;
            border: 1px solid #fecdd3;
            line-height: 1.5;
        }

        .empty-message {
            color: #777;
            background: #f8f9fc;
            border-radius: 10px;
            padding: 16px;
        }

        details.cart-details {
            margin-top: 12px;
            background: white;
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid #e5e7ef;
        }

        details.cart-details summary {
            cursor: pointer;
            font-weight: bold;
            color: #1f3c88;
            font-size: 15px;
            padding: 0;
            display: block;
        }

        .cart-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            line-height: 1.6;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.82);
            color: white;
            padding: 16px 26px;
            border-radius: 12px;
            font-size: 16px;
            display: none;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div class="sales-page">

    <div class="top-bar">
        <div>
            <h1>Sales Dashboard</h1>
            <div class="sales-info">
                Current Sales: <b id="salesName"></b>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>


    <details class="order-section" open>
        <summary>
            <span class="summary-left" id="pendingTitle">
                🟠 Pending Orders (0)
            </span>
            <span class="summary-arrow">▶</span>
        </summary>

        <div class="section-content">
            <hr class="section-line">
            <div id="pendingOrders" class="order-list"></div>
        </div>
    </details>


    <details class="order-section">
        <summary>
            <span class="summary-left" id="confirmedTitle">
                🟢 Confirmed Orders (0)
            </span>
            <span class="summary-arrow">▶</span>
        </summary>

        <div class="section-content">
            <hr class="section-line">
            <div id="confirmedOrders" class="order-list"></div>
        </div>
    </details>


    <details class="order-section">
        <summary>
            <span class="summary-left" id="returnedTitle">
                🔴 Returned Orders (0)
            </span>
            <span class="summary-arrow">▶</span>
        </summary>

        <div class="section-content">
            <hr class="section-line">
            <div id="returnedOrders" class="order-list"></div>
        </div>
    </details>

</div>

<div id="toast" class="toast"></div>


<script>
const salesUsername = localStorage.getItem("user");
const role = localStorage.getItem("role");

document.getElementById("salesName").innerText = salesUsername || "Unknown";

if (!salesUsername) {
    alert("Please login first.");
    window.location.href = "/";
}

if (role !== "sales") {
    alert("Only sales users can access this page.");
    window.location.href = "/";
}


async function loadSalesOrders() {
    const response = await fetch(
        "/sales/orders/" + encodeURIComponent(salesUsername)
    );

    const orders = await response.json();

    const pendingOrders = orders.filter(order => order.status === "Pending");
    const confirmedOrders = orders.filter(order => order.status === "Confirmed");
    const returnedOrders = orders.filter(order =>
        order.status === "Returned" || order.status === "Rejected"
    );

    pendingOrders.sort((a, b) => b.id - a.id);
    confirmedOrders.sort((a, b) => b.id - a.id);
    returnedOrders.sort((a, b) => b.id - a.id);

    document.getElementById("pendingTitle").innerText =
        "🟠 Pending Orders (" + pendingOrders.length + ")";

    document.getElementById("confirmedTitle").innerText =
        "🟢 Confirmed Orders (" + confirmedOrders.length + ")";

    document.getElementById("returnedTitle").innerText =
        "🔴 Returned Orders (" + returnedOrders.length + ")";

    renderPendingOrders(pendingOrders);
    renderConfirmedOrders(confirmedOrders);
    renderReturnedOrders(returnedOrders);
}


function renderPendingOrders(orders) {
    const container = document.getElementById("pendingOrders");
    container.innerHTML = "";

    if (orders.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No pending orders.
            </div>
        `;
        return;
    }

    orders.forEach(order => {
        container.innerHTML += `
            <div class="order-box">
                <div class="order-title">
                    Order #${order.id}
                </div>

                <div class="order-info">
                    Customer: <b>${escapeHtml(getCustomerName(order))}</b><br>
                    Total: <b>$${Number(order.total || 0).toFixed(2)}</b><br>
                    Order Time: ${escapeHtml(order.created_at || "Not recorded")}
                </div>

                ${renderCartDetails(order.items)}

                <div class="return-comment-box">
                    <label>Return Comment</label>
                    <textarea
                        id="return-comment-${order.id}"
                        placeholder="Example: Quantity is too small, packing cannot be made, product is out of stock..."
                        oninput="toggleReturnButton(${order.id})"
                    ></textarea>
                </div>

                <div class="button-row">
                    <button class="confirm-btn" onclick="confirmOrder(${order.id})">
                        Confirm
                    </button>

                    <button
                        id="return-btn-${order.id}"
                        class="return-btn"
                        onclick="returnOrder(${order.id})"
                        disabled
                    >
                        Return
                    </button>
                </div>
            </div>
        `;
    });
}


function renderConfirmedOrders(orders) {
    const container = document.getElementById("confirmedOrders");
    container.innerHTML = "";

    if (orders.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No confirmed orders.
            </div>
        `;
        return;
    }

    orders.forEach(order => {
        container.innerHTML += `
            <div class="order-box">
                <div class="order-title">
                    Order #${order.id}
                </div>

                <div class="order-info">
                    Customer: <b>${escapeHtml(getCustomerName(order))}</b><br>
                    Total: <b>$${Number(order.total || 0).toFixed(2)}</b><br>
                    Order Time: ${escapeHtml(order.created_at || "Not recorded")}
                </div>

                ${renderCartDetails(order.items)}

                <div class="status-text confirmed-text">
                    Status: Confirmed
                </div>
            </div>
        `;
    });
}


function renderReturnedOrders(orders) {
    const container = document.getElementById("returnedOrders");
    container.innerHTML = "";

    if (orders.length === 0) {
        container.innerHTML = `
            <div class="empty-message">
                No returned orders.
            </div>
        `;
        return;
    }

    orders.forEach(order => {
        container.innerHTML += `
            <div class="order-box">
                <div class="order-title">
                    Order #${order.id}
                </div>

                <div class="order-info">
                    Customer: <b>${escapeHtml(getCustomerName(order))}</b><br>
                    Total: <b>$${Number(order.total || 0).toFixed(2)}</b><br>
                    Order Time: ${escapeHtml(order.created_at || "Not recorded")}
                </div>

                ${renderCartDetails(order.items)}

                <div class="status-text returned-text">
                    Status: Returned
                </div>

                ${
                    order.return_comment
                        ? `<div class="return-reason">
                               <b>Return Reason:</b> ${escapeHtml(order.return_comment)}
                           </div>`
                        : ""
                }
            </div>
        `;
    });
}


function getCustomerName(order) {
    return (
        order.username ||
        order.customer ||
        order.customer_name ||
        order.customer_username ||
        ""
    );
}


function renderCartDetails(rawItems) {
    const items = parseItems(rawItems);

    if (!items || items.length === 0) {
        return `
            <details class="cart-details">
                <summary>Cart Items</summary>
                <div class="cart-item">No item details.</div>
            </details>
        `;
    }

    let html = `
        <details class="cart-details">
            <summary>Cart Items</summary>
    `;

    items.forEach(item => {
        const name =
            item.name ||
            item.product_name ||
            item.description ||
            "Product";

        const qty =
            item.quantity ||
            item.qty ||
            1;

        const price =
            Number(item.price || item.unit_price || 0);

        const lineTotal = Number(qty) * price;

        html += `
            <div class="cart-item">
                <b>${escapeHtml(name)}</b><br>
                Category: ${escapeHtml(item.category || "")}<br>
                MOQ: ${escapeHtml(item.moq || "")}<br>
                Material: ${escapeHtml(item.material || "")}<br>
                Size: ${escapeHtml(item.size || "")}<br>
                Packing: ${escapeHtml(item.packing || "")}<br>
                Customer Requirements: ${escapeHtml(item.customer_requirement || "")}<br>
                Quantity: ${qty}<br>
                Unit Price: $${price.toFixed(2)}<br>
                Line Total: $${lineTotal.toFixed(2)}
            </div>
        `;
    });

    html += `</details>`;

    return html;
}


function parseItems(rawItems) {
    if (!rawItems) return [];

    if (Array.isArray(rawItems)) {
        return rawItems;
    }

    if (typeof rawItems === "string") {
        try {
            return JSON.parse(rawItems);
        } catch (error) {
            return [];
        }
    }

    return [];
}


function toggleReturnButton(orderId) {
    const textarea = document.getElementById("return-comment-" + orderId);
    const button = document.getElementById("return-btn-" + orderId);

    if (!textarea || !button) return;

    button.disabled = textarea.value.trim().length === 0;
}


async function confirmOrder(orderId) {
    const ok = confirm("Confirm Order #" + orderId + "?");

    if (!ok) return;

    const response = await fetch(
        "/sales/orders/" + orderId + "/confirm",
        {
            method: "POST"
        }
    );

    const data = await response.json();

    if (!data.success) {
        alert(data.message || "Confirm failed.");
        return;
    }

    showToast("Order #" + orderId + " confirmed.");
    loadSalesOrders();
}


async function returnOrder(orderId) {
    const textarea = document.getElementById("return-comment-" + orderId);
    const comment = textarea ? textarea.value.trim() : "";

    if (!comment) {
        alert("Please enter a return comment first.");
        return;
    }

    const ok = confirm("Return Order #" + orderId + "?");

    if (!ok) return;

    const response = await fetch(
        "/sales/orders/" + orderId + "/return",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                return_comment: comment
            })
        }
    );

    const data = await response.json();

    if (!data.success) {
        alert(data.message || "Return failed.");
        return;
    }

    showToast("Order #" + orderId + " returned.");
    loadSalesOrders();
}


function showToast(message) {
    const toast = document.getElementById("toast");

    toast.innerText = message;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 1500);
}


function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function logout() {
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    window.location.href = "/";
}


loadSalesOrders();
</script>

</body>
</html>
