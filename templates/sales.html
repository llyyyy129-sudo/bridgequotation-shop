<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            font-family: "Century Gothic", CenturyGothic, AppleGothic, Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 35px;
            color: #222;
        }

        .sales-page {
            max-width: 1120px;
            margin: 0 auto;
        }

        .top-bar {
            background: white;
            border-radius: 18px;
            padding: 22px 28px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .top-bar h1 {
            margin: 0;
            color: #1f3c88;
            font-size: 30px;
        }

        .sales-info {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 18px rgba(31, 60, 136, 0.18);
        }

        .summary-card {
            background: white;
            border-radius: 18px;
            padding: 18px 24px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
            margin-bottom: 22px;
            color: #1f3c88;
            font-weight: 800;
            font-size: 20px;
        }

        .customer-section {
            background: white;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .customer-section > summary {
            list-style: none;
            cursor: pointer;
            padding: 22px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            font-size: 24px;
            font-weight: 900;
            color: #1f3c88;
        }

        .customer-section > summary::-webkit-details-marker {
            display: none;
        }

        .customer-title-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .customer-count {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 999px;
            background: #eef4ff;
            color: #1f3c88;
            font-size: 14px;
            font-weight: 800;
        }

        .summary-arrow {
            font-size: 18px;
            color: #6b7280;
            transition: transform 0.2s ease;
        }

        details[open] > summary .summary-arrow {
            transform: rotate(90deg);
        }

        .customer-content {
            padding: 0 26px 24px;
        }

        .customer-line {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 0 0 18px;
        }

        details.status-section {
            border: 1px solid #e5e7eb;
            background: #fbfcff;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        details.status-section > summary {
            list-style: none;
            cursor: pointer;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 900;
        }

        details.status-section > summary::-webkit-details-marker {
            display: none;
        }

        .status-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #111827;
            flex: 0 0 auto;
        }

        .dot-pending {
            background: #ff7a1a;
        }

        .dot-confirmed {
            background: #12d51b;
        }

        .dot-returned {
            background: #ff1f35;
        }

        .section-content {
            padding: 0 20px 18px;
        }

        .section-line {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 0 0 16px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-box {
            border: 1px solid #e2e5ec;
            border-radius: 14px;
            padding: 18px 20px;
            background: #ffffff;
        }

        .order-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .order-info {
            line-height: 1.8;
            font-size: 15px;
        }

        .button-row {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .confirm-btn {
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 18px rgba(76, 175, 80, 0.18);
        }

        .return-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 18px rgba(244, 67, 54, 0.18);
        }

        .return-btn:disabled {
            background: #fca5a5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .return-comment-box {
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
        }

        .return-comment-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #111827;
        }

        .return-comment-box textarea {
            width: 100%;
            min-height: 82px;
            resize: vertical;
            border: 1.5px solid #d7dce7;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.5;
            box-sizing: border-box;
            outline: none;
            background: white;
        }

        .return-comment-box textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .status-text {
            margin-top: 12px;
            font-weight: bold;
        }

        .confirmed-text {
            color: #4caf50;
        }

        .returned-text {
            color: #f44336;
        }

        .return-reason {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff1f2;
            color: #b91c1c;
            border: 1px solid #fecdd3;
            line-height: 1.5;
        }

        .empty-message {
            color: #777;
            background: #f8f9fc;
            border-radius: 10px;
            padding: 16px;
        }

        details.cart-details {
            margin-top: 12px;
            background: white;
            border-radius: 9px;
            padding: 10px 12px;
            border: 1px solid #e5e7ef;
        }

        details.cart-details summary {
            cursor: pointer;
            font-weight: bold;
            color: #1f3c88;
            font-size: 15px;
            padding: 0;
            display: block;
        }

        .cart-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            line-height: 1.6;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .center-toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #eef4ff;
            color: #1f3c88;
            border: 1px solid #bfdbfe;
            padding: 16px 26px;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
            font-size: 16px;
            font-weight: 700;
            line-height: 1.55;
            white-space: pre-line;
            max-width: min(520px, 86vw);
            word-break: break-word;
            text-align: center;
            display: none;
            z-index: 99999;
        }

        .center-confirm-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.12);
            z-index: 100000;
            padding: 20px;
        }

        .center-confirm-box {
            width: min(480px, 90vw);
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 18px;
            padding: 26px 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
            text-align: center;
        }

        .center-confirm-message {
            color: #111827;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.65;
            white-space: pre-line;
            margin-bottom: 22px;
        }

        .center-confirm-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .center-confirm-ok,
        .center-confirm-cancel {
            min-width: 104px;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .center-confirm-ok {
            background: #2563eb;
            color: #ffffff;
        }

        .center-confirm-cancel {
            background: #f3f4f6;
            color: #374151;
        }

        @media (max-width: 720px) {
            body {
                padding: 18px;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .customer-section > summary {
                font-size: 20px;
                padding: 18px 20px;
            }

            .customer-content {
                padding: 0 18px 18px;
            }

            details.status-section > summary {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div id="centerToast" class="center-toast"></div>

<div id="centerConfirmOverlay" class="center-confirm-overlay">
    <div class="center-confirm-box">
        <div id="centerConfirmMessage" class="center-confirm-message"></div>

        <div class="center-confirm-actions">
            <button id="centerConfirmOk" class="center-confirm-ok" type="button">Confirm</button>
            <button id="centerConfirmCancel" class="center-confirm-cancel" type="button">Cancel</button>
        </div>
    </div>
</div>


<div class="sales-page">

    <div class="top-bar">
        <div>
            <h1>Sales Dashboard</h1>
            <div class="sales-info">
                Current Sales: <b id="salesName"></b>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="summary-card" id="dashboardSummary">
        Customer Orders (0)
    </div>

    <div id="customerOrders"></div>

</div>


<script>
function showCenterMessage(message) {
    const toast = document.getElementById("centerToast");

    if (!toast) {
        return;
    }

    toast.innerText = message;
    toast.style.display = "block";

    if (window.centerToastTimer) {
        clearTimeout(window.centerToastTimer);
    }

    window.centerToastTimer = setTimeout(() => {
        toast.style.display = "none";
    }, 1700);
}


function showCenterConfirm(message) {
    return new Promise((resolve) => {
        const overlay = document.getElementById("centerConfirmOverlay");
        const messageBox = document.getElementById("centerConfirmMessage");
        const okButton = document.getElementById("centerConfirmOk");
        const cancelButton = document.getElementById("centerConfirmCancel");

        if (!overlay || !messageBox || !okButton || !cancelButton) {
            resolve(false);
            return;
        }

        messageBox.innerText = message;
        overlay.style.display = "flex";

        const close = (result) => {
            overlay.style.display = "none";
            okButton.onclick = null;
            cancelButton.onclick = null;
            overlay.onclick = null;
            resolve(result);
        };

        okButton.onclick = () => close(true);
        cancelButton.onclick = () => close(false);

        overlay.onclick = (event) => {
            if (event.target === overlay) {
                close(false);
            }
        };
    });
}


const salesUsername = localStorage.getItem("user");
const role = localStorage.getItem("role");

document.getElementById("salesName").innerText = salesUsername || "Unknown";

if (!salesUsername) {
    showCenterMessage("Please login first.");
    setTimeout(() => {
        window.location.href = "/";
    }, 900);
}

if (role !== "sales") {
    showCenterMessage("Only sales users can access this page.");
    setTimeout(() => {
        window.location.href = "/";
    }, 900);
}


async function loadSalesOrders() {
    const response = await fetch(
        "/sales/orders/" + encodeURIComponent(salesUsername)
    );

    const orders = await response.json();

    const groupedCustomers = groupOrdersByCustomer(orders);

    renderCustomerGroups(groupedCustomers);
}


function groupOrdersByCustomer(orders) {
    const groups = {};

    orders.forEach(order => {
        const customerName = getCustomerName(order) || "Unknown Customer";

        if (!groups[customerName]) {
            groups[customerName] = {
                customerName: customerName,
                orders: [],
                pending: [],
                confirmed: [],
                returned: []
            };
        }

        groups[customerName].orders.push(order);

        if (order.status === "Pending") {
            groups[customerName].pending.push(order);
        } else if (order.status === "Confirmed") {
            groups[customerName].confirmed.push(order);
        } else if (order.status === "Returned" || order.status === "Rejected") {
            groups[customerName].returned.push(order);
        } else {
            groups[customerName].pending.push(order);
        }
    });

    return Object.values(groups).sort((a, b) => {
        const latestA = getLatestOrderId(a.orders);
        const latestB = getLatestOrderId(b.orders);
        return latestB - latestA;
    });
}


function getLatestOrderId(orders) {
    if (!orders || orders.length === 0) return 0;

    return Math.max(...orders.map(order => Number(order.id || 0)));
}


function renderCustomerGroups(customerGroups) {
    const container = document.getElementById("customerOrders");

    container.innerHTML = "";

    document.getElementById("dashboardSummary").innerText =
        "Customer Orders (" + customerGroups.length + " customers)";

    if (!customerGroups || customerGroups.length === 0) {
        container.innerHTML = `
            <div class="customer-section">
                <div class="empty-message">
                    No customer orders.
                </div>
            </div>
        `;
        return;
    }

    customerGroups.forEach((group, index) => {
        group.pending.sort((a, b) => b.id - a.id);
        group.confirmed.sort((a, b) => b.id - a.id);
        group.returned.sort((a, b) => b.id - a.id);

        container.innerHTML += `
            <details class="customer-section" ${index === 0 ? "open" : ""}>
                <summary>
                    <span class="customer-title-left">
                        👤 ${escapeHtml(group.customerName)}
                        <span class="customer-count">
                            ${group.orders.length} orders
                        </span>
                    </span>
                    <span class="summary-arrow">▶</span>
                </summary>

                <div class="customer-content">
                    <hr class="customer-line">

                    ${renderStatusSection("pending", "Pending Orders", group.pending, true)}
                    ${renderStatusSection("confirmed", "Confirmed Orders", group.confirmed, false)}
                    ${renderStatusSection("returned", "Returned Orders", group.returned, false)}
                </div>
            </details>
        `;
    });
}


function renderStatusSection(type, title, orders, openByDefault) {
    const dotClass = {
        pending: "dot-pending",
        confirmed: "dot-confirmed",
        returned: "dot-returned"
    }[type];

    const emptyText = {
        pending: "No pending orders.",
        confirmed: "No confirmed orders.",
        returned: "No returned orders."
    }[type];

    return `
        <details class="status-section" ${openByDefault ? "open" : ""}>
            <summary>
                <span class="status-title-left">
                    <span class="status-dot ${dotClass}"></span>
                    ${title} (${orders.length})
                </span>
                <span class="summary-arrow">▶</span>
            </summary>

            <div class="section-content">
                <hr class="section-line">

                ${
                    orders.length === 0
                        ? `<div class="empty-message">${emptyText}</div>`
                        : `<div class="order-list">
                              ${orders.map(order => renderOrderCard(order, type)).join("")}
                           </div>`
                }
            </div>
        </details>
    `;
}


function renderOrderCard(order, type) {
    const customerName = getCustomerName(order);
    const orderTime = order.created_at || "Not recorded";

    let statusBlock = "";

    if (type === "pending") {
        statusBlock = `
            <div class="return-comment-box">
                <label>Return Comment</label>
                <textarea
                    id="return-comment-${order.id}"
                    placeholder="Example: Quantity is too small, packing cannot be made, product is out of stock..."
                    oninput="toggleReturnButton(${order.id})"
                ></textarea>
            </div>

            <div class="button-row">
                <button class="confirm-btn" onclick="confirmOrder(${order.id})">
                    Confirm
                </button>

                <button
                    id="return-btn-${order.id}"
                    class="return-btn"
                    onclick="returnOrder(${order.id})"
                    disabled
                >
                    Return
                </button>
            </div>
        `;
    }

    if (type === "confirmed") {
        statusBlock = `
            <div class="status-text confirmed-text">
                Status: Confirmed
            </div>
        `;
    }

    if (type === "returned") {
        statusBlock = `
            <div class="status-text returned-text">
                Status: Returned
            </div>

            ${
                order.return_comment
                    ? `<div class="return-reason">
                           <b>Return Reason:</b> ${escapeHtml(order.return_comment)}
                       </div>`
                    : ""
            }
        `;
    }

    return `
        <div class="order-box">
            <div class="order-title">
                Order #${order.id}
            </div>

            <div class="order-info">
                Customer: <b>${escapeHtml(customerName)}</b><br>
                Total: <b>$${Number(order.total || 0).toFixed(2)}</b><br>
                Order Time: ${escapeHtml(orderTime)}
            </div>

            ${renderCartDetails(order.items)}

            ${statusBlock}
        </div>
    `;
}


function getCustomerName(order) {
    return (
        order.username ||
        order.customer ||
        order.customer_name ||
        order.customer_username ||
        ""
    );
}


function renderCartDetails(rawItems) {
    const items = parseItems(rawItems);

    if (!items || items.length === 0) {
        return `
            <details class="cart-details">
                <summary>Cart Items</summary>
                <div class="cart-item">No item details.</div>
            </details>
        `;
    }

    let html = `
        <details class="cart-details">
            <summary>Cart Items</summary>
    `;

    items.forEach(item => {
        const name =
            item.name ||
            item.product_name ||
            item.description ||
            "Product";

        const qty =
            item.quantity ||
            item.qty ||
            1;

        const price =
            Number(item.price || item.unit_price || 0);

        const lineTotal = Number(qty) * price;

        html += `
            <div class="cart-item">
                <b>${escapeHtml(name)}</b><br>
                Category: ${escapeHtml(item.category || "")}<br>
                MOQ: ${escapeHtml(item.moq || "")}<br>
                Material: ${escapeHtml(item.material || "")}<br>
                Size: ${escapeHtml(item.size || "")}<br>
                Packing: ${escapeHtml(item.packing || "")}<br>
                Customer Requirements: ${escapeHtml(item.customer_requirement || "")}<br>
                Quantity: ${qty}<br>
                Unit Price: $${price.toFixed(2)}<br>
                Line Total: $${lineTotal.toFixed(2)}
            </div>
        `;
    });

    html += `</details>`;

    return html;
}


function parseItems(rawItems) {
    if (!rawItems) return [];

    if (Array.isArray(rawItems)) {
        return rawItems;
    }

    if (typeof rawItems === "string") {
        try {
            return JSON.parse(rawItems);
        } catch (error) {
            return [];
        }
    }

    return [];
}


function toggleReturnButton(orderId) {
    const textarea = document.getElementById("return-comment-" + orderId);
    const button = document.getElementById("return-btn-" + orderId);

    if (!textarea || !button) return;

    button.disabled = textarea.value.trim().length === 0;
}


async function confirmOrder(orderId) {
    const ok = await showCenterConfirm("Confirm Order #" + orderId + "?");

    if (!ok) return;

    const response = await fetch(
        "/sales/orders/" + orderId + "/confirm",
        {
            method: "POST"
        }
    );

    const data = await response.json();

    if (!data.success) {
        showCenterMessage(data.message || "Confirm failed.");
        return;
    }

    showCenterMessage("Order #" + orderId + " confirmed.");
    loadSalesOrders();
}


async function returnOrder(orderId) {
    const textarea = document.getElementById("return-comment-" + orderId);
    const comment = textarea ? textarea.value.trim() : "";

    if (!comment) {
        showCenterMessage("Please enter a return comment first.");
        return;
    }

    const ok = await showCenterConfirm("Return Order #" + orderId + "?");

    if (!ok) return;

    const response = await fetch(
        "/sales/orders/" + orderId + "/return",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                return_comment: comment
            })
        }
    );

    const data = await response.json();

    if (!data.success) {
        showCenterMessage(data.message || "Return failed.");
        return;
    }

    showCenterMessage("Order #" + orderId + " returned.");
    loadSalesOrders();
}


function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function logout() {
    const ok = await showCenterConfirm(
        "Logout?\n\nAre you sure you want to log out?"
    );

    if (!ok) return;

    localStorage.removeItem("user");
    localStorage.removeItem("role");
    localStorage.removeItem("assigned_sales");
    localStorage.removeItem("company_name");
    localStorage.removeItem("email");

    showCenterMessage("You have been logged out.");

    setTimeout(() => {
        window.location.href = "/";
    }, 900);
}


loadSalesOrders();
</script>

</body>
</html>
