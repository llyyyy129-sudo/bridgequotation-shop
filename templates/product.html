<link rel="stylesheet" href="/static/style.css">

<h2>Product Details</h2>

<div id="detail"></div>

<br>

<label>Quantity:</label>
<input id="quantity" type="number" value="1" min="1" onchange="updatePrice()">

<br><br>

<button onclick="addToCart()">Add to Cart</button>

<br><br>

<button onclick="goBack()">Back to List</button>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch(`/products/${id}`)
  .then(response => response.json())
  .then(product => {

    document.getElementById("quantity").value = product.moq;
    document.getElementById("quantity").min = product.moq;

    document.getElementById("detail").innerHTML = `
      <img src="${product.image}" width="250">

      <h3>${product.name}</h3>

      <p>${product.description}</p>

      <h4>Price Breaks</h4>

      <table border="1" cellpadding="8" cellspacing="0">
        <tr>
          <th>MOQ</th>
          <th>Unit Price</th>
        </tr>

        <tr>
          <td>500+</td>
          <td>$${product.price_500}</td>
        </tr>

        <tr>
          <td>1000+</td>
          <td>$${product.price_1000}</td>
        </tr>

        <tr>
          <td>3000+</td>
          <td>$${product.price_3000}</td>
        </tr>

        <tr>
          <td>10000+</td>
          <td>$${product.price_10000}</td>
        </tr>

        <tr>
          <td>50000+</td>
          <td>$${product.price_50000}</td>
        </tr>
      </table>

      <br>

      <p id="livePrice"></p>

      <p>MOQ: ${product.moq} pcs</p>
      <p>Material: ${product.material}</p>
      <p>Volume: ${product.volume}</p>
      <p>Size: ${product.size}</p>
      <p>Category: ${product.category}</p>
    `;

    window.currentProduct = product;

    updatePrice();
  });

function getTierPrice(quantity, product) {
  let unitPrice = product.price_500 || product.price;

  if (quantity >= 50000) {
    unitPrice = product.price_50000;
  }
  else if (quantity >= 10000) {
    unitPrice = product.price_10000;
  }
  else if (quantity >= 3000) {
    unitPrice = product.price_3000;
  }
  else if (quantity >= 1000) {
    unitPrice = product.price_1000;
  }
  else if (quantity >= 500) {
    unitPrice = product.price_500;
  }

  return Number(unitPrice);
}

function updatePrice() {
  const quantityInput = document.getElementById("quantity");

  let quantity = parseInt(quantityInput.value);

  if (isNaN(quantity)) {
    return;
  }

  if (quantity < currentProduct.moq) {
    alert(`Minimum Order Quantity is ${currentProduct.moq} pcs`);

    quantityInput.value = currentProduct.moq;

    quantity = currentProduct.moq;
  }

  const unitPrice = getTierPrice(quantity, currentProduct);

  document.getElementById("livePrice").innerHTML = `
    <b>Current Unit Price:</b> $${unitPrice.toFixed(2)}
    <br>
    <b>Total:</b> $${(quantity * unitPrice).toFixed(2)}
  `;
}

function addToCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const quantityInput = document.getElementById("quantity");

  let quantity = parseInt(quantityInput.value);

  if (isNaN(quantity) || quantity < currentProduct.moq) {
    alert(`Minimum Order Quantity is ${currentProduct.moq} pcs`);

    quantityInput.value = currentProduct.moq;

    updatePrice();

    return;
  }

  const unitPrice = getTierPrice(quantity, currentProduct);

  const existing = cart.find(
    item => item.id === currentProduct.id
  );

  if (existing) {
    existing.quantity += quantity;
    existing.price = getTierPrice(existing.quantity, currentProduct);
  } else {
    cart.push({
      ...currentProduct,
      quantity: quantity,
      price: unitPrice
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  alert(`Added to cart!\nUnit Price: $${unitPrice.toFixed(2)}`);
}

function goBack() {
  window.location.href = "products.html";
}
</script>
