<link rel="stylesheet" href="/static/style.css">

<h2>Shared Cart</h2>

<div id="cart"></div>

<h3 id="total"></h3>

<button onclick="addToMyCart()">Add to My Cart</button>

<script>
const params = new URLSearchParams(window.location.search);

const cartData = params.get("cart");

if(!cartData){
    document.getElementById("cart").innerHTML =
        "<h3>Invalid Share Link</h3>";
    throw new Error("No cart data");
}

const sharedCart = JSON.parse(
    decodeURIComponent(cartData)
);

const cartDiv = document.getElementById("cart");

let total = 0;

sharedCart.forEach(item => {
  const quantity = item.quantity || 1;

  total += item.price * quantity;

  cartDiv.innerHTML += `
    <div>
      <img src="${item.image}" width="160">

      <h3>${item.name}</h3>

      <p>Price: $${item.price}</p>

      <p>Quantity: ${quantity}</p>
    </div>
  `;
});

document.getElementById("total").innerText = "Total: $" + total;

function addToMyCart() {
  const user = localStorage.getItem("user");

  if (!user) {
    localStorage.setItem("sharedCart", JSON.stringify(sharedCart));
    window.location.href = "login.html";
    return;
  }

  localStorage.setItem("cart", JSON.stringify(sharedCart));

  alert("Added to your cart!");

  window.location.href = "cart.html";
}
</script>
