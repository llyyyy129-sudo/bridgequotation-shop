<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">

  <style>
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #667085;
      cursor: pointer;
      padding: 0;
      margin: 0;
      box-shadow: none;
      font-size: 18px;
      line-height: 34px;
      border-radius: 50%;
    }

    .eye-btn:hover {
      background: #f1f5f9;
      transform: translateY(-50%);
      box-shadow: none;
    }

    .password-message {
      font-size: 13px;
      margin-top: 7px;
      min-height: 18px;
      line-height: 18px;
    }

    .password-message.error {
      color: #e11d48;
      font-weight: 700;
    }

    .password-message.ok {
      color: #16a34a;
      font-weight: 700;
    }
  
        .center-toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #eef4ff;
            color: #1f3c88;
            border: 1px solid #bfdbfe;
            padding: 16px 26px;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
            font-size: 16px;
            font-weight: 700;
            line-height: 1.55;
            white-space: pre-line;
            max-width: min(520px, 86vw);
            word-break: break-word;
            text-align: center;
            display: none;
            z-index: 99999;
        }

        .center-confirm-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.12);
            z-index: 100000;
            padding: 20px;
        }

        .center-confirm-box {
            width: min(480px, 90vw);
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 18px;
            padding: 26px 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
            text-align: center;
        }

        .center-confirm-message {
            color: #111827;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.65;
            white-space: pre-line;
            margin-bottom: 22px;
        }

        .center-confirm-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .center-confirm-ok,
        .center-confirm-cancel {
            min-width: 104px;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .center-confirm-ok {
            background: #2563eb;
            color: #ffffff;
        }

        .center-confirm-cancel {
            background: #f3f4f6;
            color: #374151;
        }

    </style>
</head>

<body>

<div id="centerToast" class="center-toast"></div>

<div id="centerConfirmOverlay" class="center-confirm-overlay">
    <div class="center-confirm-box">
        <div id="centerConfirmMessage" class="center-confirm-message"></div>

        <div class="center-confirm-actions">
            <button id="centerConfirmOk" class="center-confirm-ok" type="button">Confirm</button>
            <button id="centerConfirmCancel" class="center-confirm-cancel" type="button">Cancel</button>
        </div>
    </div>
</div>


  <main class="auth-shell">

    <section class="brand-side">
      <img class="brand-image" src="/static/image/auth_background.jpg" alt="Ningbo Future Houseware Bridge">

      <h1 class="brand-title">
        Bridge Quotation<br>
        System
      </h1>

      <p class="brand-desc">
        Submit your account request. The administrator will review and approve your access.
      </p>
    </section>


    <section class="auth-card">
      <h2 class="auth-title">Create Account</h2>

      <p class="auth-subtitle">
        Choose customer or employee account type.
      </p>

      <div class="field">
        <label>Account Type</label>
        <select id="account_type">
          <option value="customer">Customer Account</option>
          <option value="employee">Employee Account</option>
        </select>
      </div>

      <div class="field">
        <label>Username</label>
        <input id="username" placeholder="Enter username">
      </div>

      <div class="field">
        <label>Password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="At least 8 characters"
            oninput="checkPasswordMatch()"
          >
          <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('password', this)"
            aria-label="Show password"
          >👁</button>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>

        <div class="password-wrap">
          <input
            id="confirm_password"
            type="password"
            placeholder="Enter password again"
            oninput="checkPasswordMatch()"
          >
          <button
            type="button"
            class="eye-btn"
            onclick="togglePassword('confirm_password', this)"
            aria-label="Show confirm password"
          >👁</button>
        </div>

        <div id="passwordMessage" class="password-message"></div>
      </div>

      <div class="field">
        <label>Company Name</label>
        <input id="company_name" placeholder="Enter company name">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter email">
      </div>

      <button class="btn btn-primary" onclick="register()">Submit Registration</button>
      <button class="btn btn-outline" onclick="goLogin()">Go to Login</button>
      <button class="btn btn-outline" onclick="goChangePassword()">Change Password</button>
    </section>

  </main>


  <script>

function showCenterMessage(message) {
    const toast = document.getElementById("centerToast");

    if (!toast) {
        return;
    }

    toast.innerText = message;
    toast.style.display = "block";

    if (window.centerToastTimer) {
        clearTimeout(window.centerToastTimer);
    }

    window.centerToastTimer = setTimeout(() => {
        toast.style.display = "none";
    }, 1700);
}


function showCenterConfirm(message) {
    return new Promise((resolve) => {
        const overlay = document.getElementById("centerConfirmOverlay");
        const messageBox = document.getElementById("centerConfirmMessage");
        const okButton = document.getElementById("centerConfirmOk");
        const cancelButton = document.getElementById("centerConfirmCancel");

        if (!overlay || !messageBox || !okButton || !cancelButton) {
            resolve(false);
            return;
        }

        messageBox.innerText = message;
        overlay.style.display = "flex";

        const close = (result) => {
            overlay.style.display = "none";
            okButton.onclick = null;
            cancelButton.onclick = null;
            overlay.onclick = null;
            resolve(result);
        };

        okButton.onclick = () => close(true);
        cancelButton.onclick = () => close(false);

        overlay.onclick = (event) => {
            if (event.target === overlay) {
                close(false);
            }
        };
    });
}


    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.innerText = "🙈";
      } else {
        input.type = "password";
        button.innerText = "👁";
      }
    }


    function checkPasswordMatch() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const message = document.getElementById("passwordMessage");

      message.className = "password-message";
      message.innerText = "";

      if (!confirmPassword) {
        return false;
      }

      if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        message.classList.add("error");
        return false;
      }

      if (password.length < 8) {
        message.innerText = "Password must be at least 8 characters.";
        message.classList.add("error");
        return false;
      }

      message.innerText = "Passwords match.";
      message.classList.add("ok");
      return true;
    }


    function register() {
      const accountType = document.getElementById("account_type").value;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value.trim();
      const companyName = document.getElementById("company_name").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!username || !password || !confirmPassword || !companyName || !email) {
        showCenterMessage("Please fill in all fields.");
        return;
      }

      if (password.length < 8) {
        document.getElementById("passwordMessage").innerText =
          "Password must be at least 8 characters.";
        document.getElementById("passwordMessage").className =
          "password-message error";
        return;
      }

      if (password !== confirmPassword) {
        document.getElementById("passwordMessage").innerText =
          "Passwords do not match.";
        document.getElementById("passwordMessage").className =
          "password-message error";
        return;
      }

      fetch("/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          account_type: accountType,
          username: username,
          password: password,
          company_name: companyName,
          email: email
        })
      })
      .then(response => response.json())
      .then(data => {
        showCenterMessage(data.message);

        if (data.success) {
          window.location.href = "login.html";
        }
      })
      .catch(error => {
        console.error("Register error:", error);
        showCenterMessage("Registration failed. Please check server logs.");
      });
    }

    function goLogin() {
      window.location.href = "login.html";
    }

    function goChangePassword() {
      window.location.href = "change_password.html";
    }
  </script>

</body>
</html>
