<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Orders</title>
  <link rel="stylesheet" href="/static/style.css">

  <style>
    body {
      background: #f5f6fa;
      padding: 38px;
    }

    .orders-page {
      max-width: 1180px;
      margin: 0 auto;
    }

    .orders-header {
      background: #ffffff;
      border-radius: 22px;
      padding: 24px 30px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .orders-header h2 {
      margin: 0;
      color: #111827;
      text-align: left;
    }

    .orders-header .sub {
      margin-top: 8px;
      color: #6b7280;
      font-size: 14px;
    }

    .orders-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .customer-board {
      background: #ffffff;
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      margin-bottom: 24px;
    }

    .customer-board-title {
      margin: 0 0 16px;
      color: #1f3c88;
      font-size: 22px;
      font-weight: 900;
    }

    .customer-board-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
    }

    .customer-board-card {
      border-radius: 16px;
      padding: 16px 18px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
    }

    .customer-board-label {
      color: #6b7280;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .customer-board-number {
      color: #111827;
      font-size: 28px;
      font-weight: 900;
    }

    .board-total {
      background: #eef4ff;
      border-color: #bfdbfe;
    }

    .board-pending {
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .board-confirmed {
      background: #ecfdf5;
      border-color: #bbf7d0;
    }

    .board-returned {
      background: #fff1f2;
      border-color: #fecdd3;
    }

    .order-section {
      background: #ffffff;
      border-radius: 22px;
      padding: 0;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      margin-bottom: 22px;
      overflow: hidden;
    }

    .order-section summary {
      list-style: none;
      cursor: pointer;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .order-section summary::-webkit-details-marker {
      display: none;
    }

    .order-section-title {
      margin: 0;
      color: #1f3c88;
      font-size: 22px;
    }

    .section-arrow {
      color: #6b7280;
      font-size: 18px;
      transition: transform 0.2s ease;
      flex: 0 0 auto;
    }

    .order-section[open] .section-arrow {
      transform: rotate(90deg);
    }

    .section-content {
      padding: 0 24px 24px;
    }

    .empty-message {
      padding: 18px;
      border-radius: 14px;
      background: #f8fafc;
      color: #6b7280;
    }

    .my-order-details {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #ffffff;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .my-order-details summary {
      cursor: pointer;
      padding: 16px 18px;
      list-style: none;
    }

    .my-order-details summary::-webkit-details-marker {
      display: none;
    }

    .my-order-summary {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .my-order-main {
      line-height: 1.65;
    }

    .my-order-time {
      color: #6b7280;
      font-size: 13px;
    }

    .my-order-toggle {
      color: #1f3c88;
      font-weight: 800;
      white-space: nowrap;
    }

    .my-order-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .delete-order-btn {
      background: #ef4444;
    }

    .delete-order-btn:hover {
      background: #dc2626;
    }

    .my-order-items {
      border-top: 1px solid #e5e7eb;
      padding: 12px 18px 18px;
      background: #fafbff;
    }

    .order-item-row {
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
      line-height: 1.7;
    }

    .order-item-row:last-child {
      border-bottom: none;
    }

    .order-item-name {
      font-weight: 800;
      color: #111827;
      font-size: 16px;
    }

    .item-status-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      margin: 8px 0;
    }

    .pill-pending {
      background: #fff7ed;
      color: #ea580c;
      border: 1px solid #fed7aa;
    }

    .pill-confirmed {
      background: #ecfdf5;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .pill-returned {
      background: #fff1f2;
      color: #dc2626;
      border: 1px solid #fecdd3;
    }

    .return-reason {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff1f2;
      color: #b91c1c;
      border: 1px solid #fecdd3;
      font-size: 14px;
      line-height: 1.5;
    }

    .center-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #eef4ff;
      color: #1f3c88;
      border: 1px solid #bfdbfe;
      padding: 16px 26px;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      max-width: min(520px, 86vw);
      word-break: break-word;
      text-align: center;
      display: none;
      z-index: 99999;
    }

    .center-confirm-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.12);
      z-index: 100000;
      padding: 20px;
    }

    .center-confirm-box {
      width: min(480px, 90vw);
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 26px 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      text-align: center;
    }

    .center-confirm-message {
      color: #111827;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.65;
      white-space: pre-line;
      margin-bottom: 22px;
    }

    .center-confirm-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .center-confirm-ok,
    .center-confirm-cancel {
      min-width: 104px;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .center-confirm-ok {
      background: #2563eb;
      color: #ffffff;
    }

    .center-confirm-cancel {
      background: #f3f4f6;
      color: #374151;
    }

    @media (max-width: 640px) {
      body { padding: 18px; }
      .orders-header { padding: 20px; }
      .orders-actions button { width: 100%; }
      .my-order-right { width: 100%; justify-content: space-between; }

      .customer-board-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div id="centerToast" class="center-toast"></div>

<div id="centerConfirmOverlay" class="center-confirm-overlay">
  <div class="center-confirm-box">
    <div id="centerConfirmMessage" class="center-confirm-message"></div>

    <div class="center-confirm-actions">
      <button id="centerConfirmOk" class="center-confirm-ok" type="button">Confirm</button>
      <button id="centerConfirmCancel" class="center-confirm-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>


<div class="orders-page">

  <div class="orders-header">
    <div>
      <h2>My Orders</h2>
      <div class="sub">
        Logged in as: <b id="currentUser"></b>
      </div>
    </div>

    <div class="orders-actions">
      <button onclick="goCart()">Back to Cart</button>
      <button onclick="goProducts()">Continue Shopping</button>
    </div>
  </div>


  <div class="customer-board">
    <h3 class="customer-board-title">Product Status Board</h3>

    <div class="customer-board-grid">
      <div class="customer-board-card board-total">
        <div class="customer-board-label">Total Products</div>
        <div id="boardTotalProducts" class="customer-board-number">0</div>
      </div>

      <div class="customer-board-card board-pending">
        <div class="customer-board-label">Pending Products</div>
        <div id="boardPendingProducts" class="customer-board-number">0</div>
      </div>

      <div class="customer-board-card board-confirmed">
        <div class="customer-board-label">Confirmed Products</div>
        <div id="boardConfirmedProducts" class="customer-board-number">0</div>
      </div>

      <div class="customer-board-card board-returned">
        <div class="customer-board-label">Returned Products</div>
        <div id="boardReturnedProducts" class="customer-board-number">0</div>
      </div>
    </div>
  </div>


  <details class="order-section" open>
    <summary>
      <h3 id="pendingTitle" class="order-section-title">🟠 Pending Orders (0)</h3>
      <span class="section-arrow">▶</span>
    </summary>

    <div id="pendingOrders" class="section-content"></div>
  </details>

  <details class="order-section">
    <summary>
      <h3 id="confirmedTitle" class="order-section-title">🟢 Confirmed Orders (0)</h3>
      <span class="section-arrow">▶</span>
    </summary>

    <div id="confirmedOrders" class="section-content"></div>
  </details>

  <details class="order-section">
    <summary>
      <h3 id="returnedTitle" class="order-section-title">🔴 Returned Orders (0)</h3>
      <span class="section-arrow">▶</span>
    </summary>

    <div id="returnedOrders" class="section-content"></div>
  </details>

</div>


<script>
function showCenterMessage(message) {
  const toast = document.getElementById("centerToast");

  if (!toast) return;

  toast.innerText = message;
  toast.style.display = "block";

  if (window.centerToastTimer) {
    clearTimeout(window.centerToastTimer);
  }

  window.centerToastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 1700);
}


function showCenterConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("centerConfirmOverlay");
    const messageBox = document.getElementById("centerConfirmMessage");
    const okButton = document.getElementById("centerConfirmOk");
    const cancelButton = document.getElementById("centerConfirmCancel");

    if (!overlay || !messageBox || !okButton || !cancelButton) {
      resolve(false);
      return;
    }

    messageBox.innerText = message;
    overlay.style.display = "flex";

    const close = (result) => {
      overlay.style.display = "none";
      okButton.onclick = null;
      cancelButton.onclick = null;
      overlay.onclick = null;
      resolve(result);
    };

    okButton.onclick = () => close(true);
    cancelButton.onclick = () => close(false);

    overlay.onclick = (event) => {
      if (event.target === overlay) {
        close(false);
      }
    };
  });
}


const currentUser = localStorage.getItem("user");

if (!currentUser) {
  window.location.href = "login.html";
}

document.getElementById("currentUser").innerText = currentUser;


async function loadMyOrders() {
  const response = await fetch(
    "/customer/orders/" + encodeURIComponent(currentUser)
  );

  const orders = await response.json();

  // Customer-facing order numbers are counted from the customer's visible orders.
  // Deleted orders are not included, so the numbers will always be continuous:
  // Order #1, Order #2, Order #3...
  orders
    .sort((a, b) => Number(a.id || 0) - Number(b.id || 0))
    .forEach((order, index) => {
      order.customer_order_no = index + 1;
    });

  updateProductStatusBoard(orders);

  const pendingOrders = orders.filter(order => order.status === "Pending");
  const confirmedOrders = orders.filter(order => order.status === "Confirmed");
  const returnedOrders = orders.filter(order =>
    order.status === "Returned" || order.status === "Rejected"
  );

  pendingOrders.sort((a, b) => b.customer_order_no - a.customer_order_no);
  confirmedOrders.sort((a, b) => b.customer_order_no - a.customer_order_no);
  returnedOrders.sort((a, b) => b.customer_order_no - a.customer_order_no);

  document.getElementById("pendingTitle").innerText =
    "🟠 Pending Orders (" + pendingOrders.length + ")";

  document.getElementById("confirmedTitle").innerText =
    "🟢 Confirmed Orders (" + confirmedOrders.length + ")";

  document.getElementById("returnedTitle").innerText =
    "🔴 Returned Orders (" + returnedOrders.length + ")";

  renderOrderGroup("pendingOrders", pendingOrders, "No pending orders.");
  renderOrderGroup("confirmedOrders", confirmedOrders, "No confirmed orders.");
  renderOrderGroup("returnedOrders", returnedOrders, "No returned orders.");
}


function updateProductStatusBoard(orders) {
  const board = {
    total: 0,
    pending: 0,
    confirmed: 0,
    returned: 0
  };

  orders.forEach(order => {
    const items = parseOrderItems(order.items);

    items.forEach(item => {
      board.total += 1;

      const status = getItemStatus(item, order.status);

      if (status === "Confirmed") {
        board.confirmed += 1;
      } else if (status === "Returned") {
        board.returned += 1;
      } else {
        board.pending += 1;
      }
    });
  });

  document.getElementById("boardTotalProducts").innerText = board.total;
  document.getElementById("boardPendingProducts").innerText = board.pending;
  document.getElementById("boardConfirmedProducts").innerText = board.confirmed;
  document.getElementById("boardReturnedProducts").innerText = board.returned;
}



function renderOrderGroup(containerId, orders, emptyText) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  if (!orders || orders.length === 0) {
    container.innerHTML = `
      <div class="empty-message">
        ${emptyText}
      </div>
    `;
    return;
  }

  orders.forEach(order => {
    container.innerHTML += renderOrderCard(order);
  });
}


function renderOrderCard(order) {
  let statusColor = "#ff9800";
  let statusText = "⏳ Pending";

  if (order.status === "Confirmed") {
    statusColor = "#4caf50";
    statusText = "✅ Confirmed";
  }

  if (order.status === "Returned" || order.status === "Rejected") {
    statusColor = "#f44336";
    statusText = "↩ Returned";
  }

  const orderTime = order.created_at || "Not recorded";
  const orderItems = parseOrderItems(order.items);
  const itemSummary = getItemSummary(orderItems, order.status);

  return `
    <details class="my-order-details" id="order-${order.id}">
      <summary>
        <div class="my-order-summary">
          <div class="my-order-main">
            <b>Order #${order.customer_order_no || order.id}</b>
            <br>
            Total: $${Number(order.total).toFixed(2)}
            <br>
            Status:
            <span style="
              color:${statusColor};
              font-weight:bold;
            ">
              ${statusText}
            </span>
            <br>
            Product Status:
            ${itemSummary.pending} Pending /
            ${itemSummary.confirmed} Confirmed /
            ${itemSummary.returned} Returned
            <br>
            <span class="my-order-time">
              Order Time: ${escapeHtml(orderTime)}
            </span>
          </div>

          <div class="my-order-right">
            <span class="my-order-toggle">
              View Order Details ▼
            </span>

            <button
              class="delete-order-btn"
              onclick="deleteOrder(event, ${order.id}, ${order.customer_order_no || order.id})"
            >
              Delete Order
            </button>
          </div>
        </div>
      </summary>

      <div class="my-order-items">
        ${renderOrderItems(orderItems, order.status)}
      </div>
    </details>
  `;
}


function getItemSummary(items, orderStatus) {
  const summary = {
    pending: 0,
    confirmed: 0,
    returned: 0
  };

  items.forEach(item => {
    const status = getItemStatus(item, orderStatus);

    if (status === "Confirmed") {
      summary.confirmed += 1;
    } else if (status === "Returned") {
      summary.returned += 1;
    } else {
      summary.pending += 1;
    }
  });

  return summary;
}


function parseOrderItems(rawItems) {
  if (!rawItems) return [];

  if (Array.isArray(rawItems)) {
    return rawItems;
  }

  if (typeof rawItems === "string") {
    try {
      return JSON.parse(rawItems);
    } catch (error) {
      return [];
    }
  }

  return [];
}


function renderOrderItems(items, orderStatus) {
  if (!items || items.length === 0) {
    return `<div class="order-item-row">No item details.</div>`;
  }

  let html = "";

  items.forEach(item => {
    const quantity = Number(item.quantity || item.qty || 0);
    const unitPrice = Number(item.price || item.unit_price || 0);
    const lineTotal = quantity * unitPrice;
    const status = getItemStatus(item, orderStatus);

    let pillClass = "pill-pending";
    let statusText = "Pending";

    if (status === "Confirmed") {
      pillClass = "pill-confirmed";
      statusText = "Confirmed";
    }

    if (status === "Returned") {
      pillClass = "pill-returned";
      statusText = "Returned";
    }

    html += `
      <div class="order-item-row">
        <div class="order-item-name">
          ${escapeHtml(item.name || item.product_name || "Product")}
        </div>

        <div class="item-status-pill ${pillClass}">
          ${statusText}
        </div>
        <br>

        Category: ${escapeHtml(item.category || "")}<br>
        MOQ: ${escapeHtml(item.moq || "")}<br>
        Material: ${escapeHtml(item.material || "")}<br>
        Size: ${escapeHtml(item.size || "")}<br>
        Packing: ${escapeHtml(item.packing || "")}<br>
        Customer Requirements: ${escapeHtml(item.customer_requirement || "")}<br>
        Quantity: ${quantity.toLocaleString()}<br>
        Unit Price: $${money(unitPrice)}<br>
        Line Total: $${money(lineTotal)}

        ${
          status === "Returned" && item.item_return_comment
            ? `<div class="return-reason">
                 <b>Return Reason:</b> ${escapeHtml(item.item_return_comment)}
               </div>`
            : ""
        }
      </div>
    `;
  });

  return html;
}


function getItemStatus(item, orderStatus) {
  if (item && item.item_status) {
    return item.item_status;
  }

  if (orderStatus === "Confirmed") {
    return "Confirmed";
  }

  if (orderStatus === "Returned" || orderStatus === "Rejected") {
    return "Returned";
  }

  return "Pending";
}


async function deleteOrder(event, orderId, displayOrderNo) {
  event.preventDefault();
  event.stopPropagation();

  const ok = await showCenterConfirm(
    "Delete Order #" + displayOrderNo + "?\n\nThis will remove it from your My Orders list."
  );

  if (!ok) return;

  try {
    const response = await fetch(
      "/customer/orders/" + orderId + "/delete",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: currentUser
        })
      }
    );

    const data = await response.json();

    if (!data.success) {
      showCenterMessage(data.message || "Delete failed.");
      return;
    }

    showCenterMessage("Order #" + displayOrderNo + " has been deleted.");
    await loadMyOrders();

  } catch (error) {
    console.error("Delete order error:", error);
    showCenterMessage("Delete failed. Please check server logs.");
  }
}


function money(value) {
  return Number(value || 0).toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}


function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function goCart() {
  window.location.href = "cart.html";
}


function goProducts() {
  window.location.href = "products.html";
}


loadMyOrders();
</script>

</body>
</html>
