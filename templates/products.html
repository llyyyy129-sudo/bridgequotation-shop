<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Products List</title>
  <link rel="stylesheet" href="/static/style.css">

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .header-left {
      flex: 1;
      min-width: 320px;
    }

    .header-left h2 {
      text-align: center;
      margin-top: 0;
    }

    .customer-status-card {
      background: white;
      border-radius: 22px;
      padding: 20px 22px;
      min-width: 340px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid rgba(15, 23, 42, 0.05);
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      color: #111827;
      white-space: nowrap;
    }

    .status-label {
      color: #6b7280;
      font-weight: 600;
    }

    .status-value {
      font-weight: 800;
      color: #111827;
    }

    .sales-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef4ff;
      color: #1f3c88;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }

    .logout-small-btn {
      margin: 0;
      padding: 11px 18px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .view-cart-row {
      margin: 28px 0;
    }

    .category-buttons button {
      position: relative;
      opacity: 0.86;
    }

    .category-buttons button.active-category {
      opacity: 1;
      background: linear-gradient(135deg, #0f3fb5, #1d4ed8);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(29, 78, 216, 0.36);
      border: 2px solid rgba(255,255,255,0.95);
    }

    .category-buttons button.active-category::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 42%;
      height: 4px;
      border-radius: 999px;
      background: #1d4ed8;
      box-shadow: 0 3px 8px rgba(29, 78, 216, 0.25);
    }

    .current-category-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 14px;
      background: white;
      border-radius: 999px;
      color: #1f3c88;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
    }

    .slogan-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 18px 0;
      min-height: 32px;
    }

    .slogan-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.2px;
      border: 1px solid #fed7aa;
    }

    .slogan-badge.blue {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .slogan-badge.green {
      background: #ecfdf5;
      color: #047857;
      border-color: #bbf7d0;
    }

    .slogan-badge.purple {
      background: #f5f3ff;
      color: #6d28d9;
      border-color: #ddd6fe;
    }

    .product-card p {
      margin-bottom: 10px;
    }

    @media (max-width: 900px) {
      .page-header {
        flex-direction: column;
      }

      .customer-status-card {
        width: 100%;
        min-width: 0;
      }

      .header-left h2 {
        text-align: left;
      }
    }

    @media (max-width: 520px) {
      .customer-status-card {
        flex-direction: column;
        align-items: stretch;
      }

      .logout-small-btn {
        width: 100%;
      }

      .status-line {
        white-space: normal;
      }
    }

    .center-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #eef4ff;
      color: #1f3c88;
      border: 1px solid #bfdbfe;
      padding: 16px 26px;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.16);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      max-width: min(520px, 86vw);
      word-break: break-word;
      text-align: center;
      display: none;
      z-index: 99999;
    }

    .center-confirm-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.12);
      z-index: 100000;
      padding: 20px;
    }

    .center-confirm-box {
      width: min(480px, 90vw);
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 26px 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      text-align: center;
    }

    .center-confirm-message {
      color: #111827;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.65;
      white-space: pre-line;
      margin-bottom: 22px;
    }

    .center-confirm-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .center-confirm-ok,
    .center-confirm-cancel {
      min-width: 104px;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10);
    }

    .center-confirm-ok {
      background: #2563eb;
      color: #ffffff;
    }

    .center-confirm-cancel {
      background: #f3f4f6;
      color: #374151;
    }

    .sales-mode-banner {
      margin: 0 40px 26px;
      background: #eef4ff;
      border: 1px solid #bfdbfe;
      border-radius: 18px;
      padding: 18px 22px;
      color: #1f3c88;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.12);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sales-mode-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .sales-mode-sub {
      font-size: 14px;
      color: #4b5563;
      font-weight: 700;
    }

    .sales-mode-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sales-mode-actions button {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 900;
    }

    .back-sales-btn {
      background: #1f3c88;
    }

</style>
</head>

<body>

<div id="centerToast" class="center-toast"></div>

<div id="centerConfirmOverlay" class="center-confirm-overlay">
  <div class="center-confirm-box">
    <div id="centerConfirmMessage" class="center-confirm-message"></div>

    <div class="center-confirm-actions">
      <button id="centerConfirmOk" class="center-confirm-ok" type="button">Confirm</button>
      <button id="centerConfirmCancel" class="center-confirm-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>


  <div class="page-header">

    <div class="header-left">
      <h2>Products List</h2>

      <input
        id="searchInput"
        placeholder="Search Products name..."
        oninput="filterProducts()"
      >

      <div class="category-buttons">
        <button data-category="All" onclick="setCategory('All')">All</button>
        <button data-category="Electronics" onclick="setCategory('Electronics')">Electronics</button>
        <button data-category="Coffee" onclick="setCategory('Coffee')">Coffee</button>
        <button data-category="Storage" onclick="setCategory('Storage')">Storage</button>
        <button data-category="Bakeware" onclick="setCategory('Bakeware')">Bakeware</button>
        <button data-category="Decoration" onclick="setCategory('Decoration')">Decoration</button>
        <button data-category="Food" onclick="setCategory('Food')">Food</button>
      </div>

      <div class="current-category-title">
        Current Category:
        <span id="currentCategoryLabel">All</span>
      </div>
    </div>


    <div class="customer-status-card">
      <div class="status-info">
        <div class="status-line">
          <span class="status-label">Logged in as:</span>
          <span class="status-value" id="currentUser"></span>
        </div>

        <div class="sales-pill">
          <span>Sales Contact:</span>
          <span id="assignedSales">Loading...</span>
        </div>
      </div>

      <button class="logout-small-btn" onclick="logout()">Logout</button>
    </div>

  </div>


  <div id="salesModeBanner" class="sales-mode-banner">
    <div>
      <div class="sales-mode-title">
        Sales Mode
      </div>

      <div class="sales-mode-sub">
        Creating order for customer:
        <b id="salesModeCustomerName"></b>
      </div>
    </div>

    <div class="sales-mode-actions">
      <button onclick="goCart()">View Customer Cart</button>
      <button class="back-sales-btn" onclick="backToSalesDashboard()">Back to Sales Dashboard</button>
    </div>
  </div>


  <div class="view-cart-row">
    <button onclick="goCart()">View Cart</button>
  </div>

  <div id="list"></div>


<script>

function showCenterMessage(message) {
  const toast = document.getElementById("centerToast");

  if (!toast) {
    return;
  }

  toast.innerText = message;
  toast.style.display = "block";

  if (window.centerToastTimer) {
    clearTimeout(window.centerToastTimer);
  }

  window.centerToastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 1700);
}


function showCenterConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("centerConfirmOverlay");
    const messageBox = document.getElementById("centerConfirmMessage");
    const okButton = document.getElementById("centerConfirmOk");
    const cancelButton = document.getElementById("centerConfirmCancel");

    if (!overlay || !messageBox || !okButton || !cancelButton) {
      resolve(false);
      return;
    }

    messageBox.innerText = message;
    overlay.style.display = "flex";

    const close = (result) => {
      overlay.style.display = "none";
      okButton.onclick = null;
      cancelButton.onclick = null;
      overlay.onclick = null;
      resolve(result);
    };

    okButton.onclick = () => close(true);
    cancelButton.onclick = () => close(false);

    overlay.onclick = (event) => {
      if (event.target === overlay) {
        close(false);
      }
    };
  });
}





let allProducts = [];
let currentCategory = "All";

const user = localStorage.getItem("user");
const role = localStorage.getItem("role") || "";

const urlParams = new URLSearchParams(window.location.search);
const urlSalesCustomer = urlParams.get("sales_customer");

if (urlSalesCustomer && role === "sales") {
  localStorage.setItem("sales_mode_active", "1");
  localStorage.setItem("sales_mode_customer", urlSalesCustomer);
  localStorage.setItem("sales_mode_sales", user || "");
}

const salesModeActive =
  role === "sales" &&
  localStorage.getItem("sales_mode_active") === "1" &&
  localStorage.getItem("sales_mode_customer");

const salesModeCustomer =
  salesModeActive ? localStorage.getItem("sales_mode_customer") : "";

const productPriceUsername =
  salesModeActive ? salesModeCustomer : user;

if (!user) {
  window.location.href = "login.html";
}

document.getElementById("currentUser").innerText = user;

const container = document.getElementById("list");

setupSalesModeBanner();
loadCustomerInfo();

fetch("/products?username=" + encodeURIComponent(productPriceUsername))
  .then(response => response.json())
  .then(products => {
    allProducts = products;
    updateActiveCategory();
    filterProducts();
  });


function setupSalesModeBanner() {
  const banner = document.getElementById("salesModeBanner");

  if (!banner) return;

  if (salesModeActive) {
    banner.style.display = "flex";
    document.getElementById("salesModeCustomerName").innerText =
      salesModeCustomer;
  } else {
    banner.style.display = "none";
  }
}


function loadCustomerInfo() {
  const fallbackSales = localStorage.getItem("assigned_sales") || "Not assigned";
  const infoUsername = salesModeActive ? salesModeCustomer : user;

  document.getElementById("assignedSales").innerText =
    salesModeActive ? user : fallbackSales;

  fetch("/customer/info/" + encodeURIComponent(infoUsername))
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        const assignedSales = data.assigned_sales || "Not assigned";

        if (salesModeActive) {
          document.getElementById("assignedSales").innerText = user;
          localStorage.setItem("sales_mode_customer_company", data.company_name || "");
          localStorage.setItem("sales_mode_customer_email", data.email || "");
        } else {
          document.getElementById("assignedSales").innerText = assignedSales;
          localStorage.setItem("assigned_sales", assignedSales);
          localStorage.setItem("customer_level", data.customer_level || "A");
        }
      }
    })
    .catch(error => {
      console.error("Customer info error:", error);
      document.getElementById("assignedSales").innerText =
        salesModeActive ? user : fallbackSales;
    });
}


function view(id) {
  if (salesModeActive) {
    window.location.href =
      "product.html?id=" + id +
      "&sales_customer=" + encodeURIComponent(salesModeCustomer);
    return;
  }

  window.location.href = "product.html?id=" + id;
}


function goCart() {
  window.location.href = "cart.html";
}


function backToSalesDashboard() {
  window.location.href = "sales.html";
}


async function logout() {
  const ok = await showCenterConfirm(
    "Logout?\n\nAre you sure you want to log out?"
  );

  if (!ok) return;

  localStorage.removeItem("user");
  localStorage.removeItem("role");
  localStorage.removeItem("assigned_sales");
  localStorage.removeItem("company_name");
  localStorage.removeItem("email");
  localStorage.removeItem("sales_mode_active");
  localStorage.removeItem("sales_mode_customer");
  localStorage.removeItem("sales_mode_sales");
  localStorage.removeItem("sales_mode_customer_company");
  localStorage.removeItem("sales_mode_customer_email");

  showCenterMessage("You have been logged out.");

  setTimeout(() => {
    window.location.href = "login.html";
  }, 900);
}


function setCategory(category) {
  currentCategory = category;
  updateActiveCategory();
  filterProducts();
}


function updateActiveCategory() {
  document.getElementById("currentCategoryLabel").innerText = currentCategory;

  document.querySelectorAll(".category-buttons button").forEach(button => {
    const buttonCategory = button.getAttribute("data-category");

    if (buttonCategory === currentCategory) {
      button.classList.add("active-category");
    } else {
      button.classList.remove("active-category");
    }
  });
}


function filterProducts() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allProducts.filter(p => {
    const name = (p.name || "").toLowerCase();
    const category = (p.category || "").trim().toLowerCase();

    const matchName = name.includes(keyword);

    const matchCategory =
      currentCategory === "All" ||
      category === currentCategory.toLowerCase();

    return matchName && matchCategory;
  });

  renderProducts(filtered);
}


function getProductSlogan(product, index) {
  const category = (product.category || "").trim().toLowerCase();

  if (product.slogan) {
    return product.slogan;
  }

  if (category === "storage") {
    return index % 2 === 0 ? "Space Saving" : "Hot Selling";
  }

  if (category === "electronics") {
    return index % 2 === 0 ? "New Arrival" : "Special Price";
  }

  if (category === "coffee") {
    return index % 2 === 0 ? "Premium Choice" : "Best Seller";
  }

  if (category === "bakeware") {
    return index % 2 === 0 ? "Kitchen Essential" : "Hot Selling";
  }

  if (category === "decoration") {
    return index % 2 === 0 ? "Elegant Design" : "Gift Pick";
  }

  if (category === "food") {
    return index % 2 === 0 ? "Daily Use" : "Special Price";
  }

  const slogans = [
    "Hot Selling",
    "Special Price",
    "New Arrival",
    "Best Seller",
    "Recommended"
  ];

  return slogans[index % slogans.length];
}


function getSloganColor(index) {
  const colors = ["", "blue", "green", "purple"];
  return colors[index % colors.length];
}


function renderProducts(products) {
  container.innerHTML = "";

  products.forEach((p, index) => {
    const div = document.createElement("div");
    div.className = "product-card";

    const slogan = getProductSlogan(p, index);
    const sloganColor = getSloganColor(index);

    div.innerHTML = `
      <img src="${p.image}" class="product-image">
      <h3>${p.name}</h3>
      <p>Price: $${p.price}</p>

      <div class="slogan-row">
        <span class="slogan-badge ${sloganColor}">
          ${slogan}
        </span>
      </div>

      <button onclick="view(${p.id})">View Details</button>
    `;

    container.appendChild(div);
  });
}
</script>

</body>
</html>
